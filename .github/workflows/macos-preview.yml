name: macOS Preview Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.1'
  ELECTRON_VERSION: '43.2.0'
  SQLCIPHER_SOURCE_REVISION: e2a6040f2ae5cfff2b3e08eb3320007d93cdf3fc

jobs:
  validate-source:
    name: Validate immutable preview source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout source without privileged credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Require exact internal source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "NSIETeam/otto-new"
          git fetch --no-tags origin internal
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(git rev-parse origin/internal)" || {
            echo "Preview builds must run from the latest internal commit." >&2
            exit 1
          }

  sqlcipher-native:
    name: Build verified SQLCipher native matrix
    needs: validate-source
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/sqlcipher-native.yml
    with:
      require_attestation: true

  preview:
    name: Audit and package macOS preview
    runs-on: macos-latest
    timeout-minutes: 90
    needs:
      - validate-source
      - sqlcipher-native
    permissions:
      contents: read
      attestations: read

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci
        env:
          PYTHON: python3.11
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download verified SQLCipher native matrix
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sqlcipher-native-matrix
          path: native/sqlcipher

      - name: Verify SQLCipher provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-sqlcipher-native-assets.mjs \
            --expected-build-commit "$GITHUB_SHA" \
            --expected-source-revision "$SQLCIPHER_SOURCE_REVISION" \
            --expected-runtime-version "$ELECTRON_VERSION" \
            --require-matrix-manifest
          while IFS= read -r -d '' binding; do
            gh attestation verify "$binding" --repo "$GITHUB_REPOSITORY"
          done < <(find native/sqlcipher -type f -name better_sqlite3.node -print0)

      - name: Repository and quality audit
        run: |
          npm run doctor
          git diff --check
          npm run validate:integration-baseline
          npm run validate:boundaries
          npm run lint:ci
          npm run build
          npm run typecheck
          npm run test:ci

      - name: Build desktop application
        working-directory: packages/desktop
        run: npm run build

      - name: Resolve preview signing mode
        id: signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$MAC_CSC_LINK" ] \
            && [ -n "$MAC_CSC_KEY_PASSWORD" ] \
            && [ -n "$APPLE_ID" ] \
            && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] \
            && [ -n "$APPLE_TEAM_ID" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=unsigned-preview" >> "$GITHUB_OUTPUT"
            echo "Apple signing custody is unavailable; producing an explicitly unsigned preview artifact."
          fi

      - name: Build signed macOS preview images
        if: ${{ steps.signing.outputs.mode == 'signed' }}
        working-directory: packages/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx electron-builder --mac dmg --arm64 --x64 --publish never

      - name: Build unsigned macOS preview images
        if: ${{ steps.signing.outputs.mode == 'unsigned-preview' }}
        working-directory: packages/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac dmg --arm64 --x64 --publish never \
            --config.mac.identity=null \
            --config.mac.hardenedRuntime=false \
            --config.mac.notarize=false \
            --config.dmg.sign=false

      - name: Verify and stage versionless preview artifacts
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          MAX_DMG_BYTES=$((120 * 1024 * 1024))
          SIGNING_MODE="${{ steps.signing.outputs.mode }}"
          mkdir -p preview-output
          for arch in arm64 x64; do
            source="packages/desktop/release/Otto-${VERSION}-${arch}.dmg"
            if [ "$SIGNING_MODE" = "signed" ]; then
              target="preview-output/Otto-macOS-Preview-${arch}.dmg"
            else
              target="preview-output/Otto-macOS-Preview-Unsigned-${arch}.dmg"
            fi
            test -f "$source"
            size="$(stat -f '%z' "$source")"
            if [ "$size" -gt "$MAX_DMG_BYTES" ]; then
              echo "$source is ${size} bytes; preview DMGs must not exceed 120 MiB." >&2
              exit 1
            fi
            hdiutil verify "$source"
            if [ "$SIGNING_MODE" = "signed" ]; then
              codesign --verify --verbose=2 "$source"
              spctl --assess --type open --context context:primary-signature --verbose=4 "$source"
            fi
            cp "$source" "$target"
          done
          shasum -a 256 preview-output/*.dmg > preview-output/SHA256SUMS.txt
          SIGNING_MODE="$SIGNING_MODE" node -e 'const fs=require("node:fs");fs.writeFileSync("preview-output/provenance.json",JSON.stringify({sourceRepository:process.env.GITHUB_REPOSITORY,sourceCommit:process.env.GITHUB_SHA,workflowRunId:process.env.GITHUB_RUN_ID,internalVersion:require("./package.json").version,signingStatus:process.env.SIGNING_MODE,builtAt:new Date().toISOString()},null,2)+"\n")'

      - name: Upload macOS preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Otto-macOS-Preview
          path: preview-output/*
          if-no-files-found: error
          retention-days: 14
