name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release. Empty means package.json version.'
        required: false
        type: string
      draft:
        description: 'Create or update a draft release.'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark release as prerelease.'
        required: false
        type: boolean
        default: false
      unsigned_mac_transition:
        description: 'Build unsigned Windows and macOS transition test artifacts when signing is unavailable.'
        required: false
        type: boolean
        default: false
      release_channel:
        description: 'Enterprise package release channel.'
        required: false
        type: choice
        options:
          - stable
          - transition
        default: stable
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: otto-production-${{ github.repository }}
  queue: max
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.1'
  NPM_VERSION: '10.9.8'
  ELECTRON_VERSION: '43.2.0'
  RUST_TOOLCHAIN: '1.97.1'
  SQLCIPHER_SOURCE_REVISION: e2a6040f2ae5cfff2b3e08eb3320007d93cdf3fc
  RELEASES_REPO: NSIETeam/otto-new
  LEGACY_RELEASES_REPO: Felix201209/otto-releases
  UPDATE_MIRROR_ASSET_BASE_URL: 'https://59.110.154.44:7777/downloads'
  UPDATE_MIRROR_MANIFEST_URL: 'https://59.110.154.44:7777/otto-releases/latest.json'
  UPDATE_MIRROR_ROOT: '/opt/otto-website'

jobs:
  validate-mode:
    name: Validate release mode boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject unsafe transition parameter combinations
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          UNSIGNED_MAC_TRANSITION: ${{ inputs.unsigned_mac_transition && 'true' || 'false' }}
          RELEASE_CHANNEL: ${{ inputs.release_channel || 'stable' }}
          DRAFT_RELEASE: ${{ inputs.draft && 'true' || 'false' }}
          PRERELEASE: ${{ inputs.prerelease && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "$REPOSITORY" != "NSIETeam/otto-new" ]; then
            echo "Release workflow may only run in NSIETeam/otto-new, not $REPOSITORY." >&2
            exit 1
          fi
          if [ "$UNSIGNED_MAC_TRANSITION" = "true" ] || [ "$RELEASE_CHANNEL" = "transition" ]; then
            if [ "$EVENT_NAME" != "workflow_dispatch" ] \
              || [ "$UNSIGNED_MAC_TRANSITION" != "true" ] \
              || [ "$RELEASE_CHANNEL" != "transition" ] \
              || [ "$DRAFT_RELEASE" != "true" ] \
              || [ "$PRERELEASE" != "true" ]; then
              echo "Unsigned transition builds require workflow_dispatch, unsigned_mac_transition=true, release_channel=transition, draft=true, and prerelease=true." >&2
              exit 1
            fi
          fi
          if [ "$PRERELEASE" = "true" ] && [ "$DRAFT_RELEASE" != "true" ]; then
            echo "Prerelease artifacts must remain draft-only and cannot deploy or update existing users." >&2
            exit 1
          fi

  validate-source:
    name: Validate immutable release source
    needs: validate-mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify locked Node.js runtime
        shell: bash
        run: test "$(node --version)" = "v${NODE_VERSION}"

      - name: Resolve and validate release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          DESKTOP_VERSION="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$VERSION" != "$ROOT_VERSION" ] || [ "$VERSION" != "$DESKTOP_VERSION" ]; then
            echo "Version mismatch: target=$VERSION root=$ROOT_VERSION desktop=$DESKTOP_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require the exact latest internal commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin internal
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          INTERNAL_COMMIT="$(git rev-parse origin/internal)"
          if [ "$SOURCE_COMMIT" != "$INTERNAL_COMMIT" ]; then
            echo "Release source must exactly equal the latest origin/internal commit." >&2
            echo "source=$SOURCE_COMMIT internal=$INTERNAL_COMMIT" >&2
            exit 1
          fi
          if ! git diff --quiet "$INTERNAL_COMMIT" "$SOURCE_COMMIT" -- .github/workflows; then
            echo "Release workflow changes must land on the default internal branch before creating a release." >&2
            git diff --name-only "$INTERNAL_COMMIT" "$SOURCE_COMMIT" -- .github/workflows >&2
            exit 1
          fi
          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

  linux-enterprise-deployment-integration:
    name: Verify Linux Root Deployment Transactions
    needs: validate-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Exercise root gateway, signatures, locks and mirror rollback
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --pids-limit 256 \
            --memory 512m \
            --cpus 2 \
            --security-opt no-new-privileges \
            --user 0:0 \
            -e OTTO_CI_INTEGRATION_CONTAINER=1 \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            python@sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579 \
            bash /workspace/scripts/tests/enterprise-ci-linux-integration.sh

  sqlcipher-native:
    name: Build verified SQLCipher native matrix
    needs: validate-source
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/sqlcipher-native.yml

  otto-native:
    name: Build verified Otto native ${{ matrix.target }}
    needs: validate-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
            cargo_target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: darwin-x64
            cargo_target: x86_64-apple-darwin
          - runner: macos-15
            target: darwin-arm64
            cargo_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify locked Node.js runtime
        shell: bash
        run: test "$(node --version)" = "v${NODE_VERSION}"

      - name: Install locked Rust toolchain target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.cargo_target }}"
          rustup default "$RUST_TOOLCHAIN"

      - name: Build and probe exact Otto native runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/otto-native-runtime.mjs build \
            --target "${{ matrix.target }}" \
            --build-commit "$GITHUB_SHA" \
            --toolchain "$RUST_TOOLCHAIN" \
            --probe

      - name: Attest Otto native runtime and manifest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: native/otto-native/${{ matrix.target }}/*

      - name: Upload exact Otto native runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: otto-native-${{ matrix.target }}
          path: native/otto-native/${{ matrix.target }}
          if-no-files-found: error

  build:
    name: Check, Build, Draft Release
    runs-on: macos-latest
    environment: production-approval
    timeout-minutes: 90
    needs:
      - validate-source
      - linux-enterprise-deployment-integration
      - sqlcipher-native
      - otto-native
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ needs.validate-source.outputs.version }}
      tag: ${{ needs.validate-source.outputs.tag }}
      source_commit: ${{ needs.validate-source.outputs.source_commit }}
      package_identity: ${{ steps.artifacts.outputs.package_identity }}

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify locked JavaScript toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Setup Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Prime reviewed ripgrep postinstall cache
        run: node packages/desktop/scripts/prime-vscode-ripgrep-cache.mjs

      - name: Install dependencies
        run: npm ci
        env:
          PYTHON: python3.11

      - name: Verify installed ripgrep postinstall result
        shell: bash
        run: |
          set -euo pipefail
          ARCH="$(node -p 'process.arch')"
          RIPGREP='node_modules/@vscode/ripgrep/bin/rg'
          node packages/desktop/scripts/ripgrep-runtime.mjs "$RIPGREP" \
            --platform darwin --arch "$ARCH" --require-source-digest
          "$RIPGREP" --version | grep -F 'ripgrep 15.0.0'

      - name: Enforce release dependency audit
        run: npm run security:dependencies:release

      - name: Verify hostile-server defenses and E2EE release authorization
        run: |
          npm run security:e2ee:adversarial
          npm run security:e2ee:release:verify
          npm run security:e2ee:policy:check

      - name: Preserve E2EE adversarial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2ee-adversarial-release-evidence
          path: artifacts/security/e2ee-adversarial-report.json
          if-no-files-found: error

      - name: Download verified SQLCipher native matrix
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sqlcipher-native-matrix
          path: native/sqlcipher

      - name: Verify SQLCipher native matrix before packaging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-sqlcipher-native-assets.mjs \
            --expected-build-commit "$GITHUB_SHA" \
            --expected-source-revision "$SQLCIPHER_SOURCE_REVISION" \
            --expected-runtime-version "$ELECTRON_VERSION" \
            --require-matrix-manifest
          while IFS= read -r -d '' binding; do
            gh attestation verify "$binding" --repo "$GITHUB_REPOSITORY"
          done < <(find native/sqlcipher -type f -name better_sqlite3.node -print0)
          gh attestation verify native/sqlcipher/matrix-manifest.json \
            --repo "$GITHUB_REPOSITORY"

      - name: Download verified enterprise Node.js SQLCipher native matrix
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sqlcipher-node-native-matrix
          path: native/sqlcipher-node

      - name: Verify enterprise Node.js SQLCipher matrix before packaging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-sqlcipher-native-assets.mjs \
            --root native/sqlcipher-node \
            --runtime node \
            --expected-build-commit "$GITHUB_SHA" \
            --expected-source-revision "$SQLCIPHER_SOURCE_REVISION" \
            --expected-runtime-version "$NODE_VERSION" \
            --require-matrix-manifest
          while IFS= read -r -d '' binding; do
            gh attestation verify "$binding" --repo "$GITHUB_REPOSITORY"
          done < <(find native/sqlcipher-node -type f -name better_sqlite3.node -print0)
          gh attestation verify native/sqlcipher-node/matrix-manifest.json \
            --repo "$GITHUB_REPOSITORY"

      - name: Download verified Otto native win32-x64 runtime
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: otto-native-win32-x64
          path: native/otto-native/win32-x64

      - name: Download verified Otto native darwin-x64 runtime
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: otto-native-darwin-x64
          path: native/otto-native/darwin-x64

      - name: Download verified Otto native darwin-arm64 runtime
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: otto-native-darwin-arm64
          path: native/otto-native/darwin-arm64

      - name: Verify and authenticate Otto native matrix before packaging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for target in win32-x64 darwin-x64 darwin-arm64; do
            node scripts/otto-native-runtime.mjs verify \
              --target "$target" \
              --expected-build-commit "$GITHUB_SHA" \
              --expected-toolchain "$RUST_TOOLCHAIN"
            while IFS= read -r -d '' artifact; do
              gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
            done < <(find "native/otto-native/$target" -maxdepth 1 -type f -print0)
          done

      - name: Validate enterprise license trust anchor
        if: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) }}
        shell: bash
        env:
          LICENSE_PUBLIC_KEYS: ${{ secrets.OTTO_LICENSE_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          test -n "$LICENSE_PUBLIC_KEYS"

      - name: Require desktop signing and notarization custody
        if: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) }}
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ENTERPRISE_SIGNING_PRIVATE_KEY: ${{ secrets.OTTO_ENTERPRISE_SIGNING_PRIVATE_KEY }}
          ENTERPRISE_SIGNING_PUBLIC_KEY: ${{ secrets.OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$MAC_CSC_LINK"
          test -n "$MAC_CSC_KEY_PASSWORD"
          test -n "$WIN_CSC_LINK"
          test -n "$WIN_CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$ENTERPRISE_SIGNING_PRIVATE_KEY"
          test -n "$ENTERPRISE_SIGNING_PUBLIC_KEY"

      - name: Repository anomaly checks
        run: |
          npm run doctor
          npm run code-map:check
          git diff --check
          npm run validate:integration-baseline
          npm run validate:boundaries
          npm run size:source:check

      - name: Release quality gates
        run: |
          npm run lint:ci
          npm run build
          npm run typecheck
          npm run test:ci
          npm run test:scripts -- --run \
            scripts/tests/enterprise-runtime-dependencies.test.js

      - name: Focused regression tests
        run: |
          npx vitest run \
            packages/core/src/config/lazy-heavy-tools.registration.test.ts \
            packages/core/src/core/customModelAdapter.test.ts \
            packages/desktop/src/main/enterprise-client.test.ts \
            packages/desktop/scripts/packaging-contract.test.mjs \
            packages/desktop/src/main/video-editor-resource.test.ts \
            packages/desktop/scripts/make-latest-json.test.mjs \
            packages/desktop/scripts/update-mirror-config.test.mjs \
            packages/server/src/enterprise/db.test.ts \
            packages/server/src/enterprise/parkEndpoints.test.ts \
            packages/server/src/server.test.ts \
            packages/server/src/enterprise/server.test.ts

      - name: Verify V1.9.13 to V1.9.14 upgrade acceptance
        run: npm run release:upgrade:verify

      - name: Build desktop release artifacts
        run: node scripts/make-delivery-zip.mjs --build
        working-directory: packages/desktop
        env:
          OTTO_RELEASES_REPO: ${{ env.RELEASES_REPO }}
          OTTO_UPDATE_ASSET_BASE_URL: https://github.com/${{ env.RELEASES_REPO }}/releases/download/v${{ needs.validate-source.outputs.version }}
          OTTO_UPDATE_MIRROR_ASSET_BASE_URL: ${{ env.UPDATE_MIRROR_ASSET_BASE_URL }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OTTO_ALLOW_UNSIGNED_MAC: ${{ inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true && '1' || '0' }}

      - name: Enforce packaged content and installer size budget
        run: npm run release:gate --workspace=packages/desktop
        env:
          OTTO_DESKTOP_BASELINE_INSTALLER_BYTES: '128032671'
          OTTO_DESKTOP_MAX_INSTALLER_GROWTH_MB: '8'
          OTTO_DESKTOP_MAX_INSTALLER_MB: '140'

      - name: Verify signed macOS disk images
        if: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate-source.outputs.version }}"
          for arch in arm64 x64; do
            dmg="packages/desktop/release/Otto-${VERSION}-${arch}.dmg"
            codesign --verify --verbose=2 "$dmg"
            spctl --assess --type open --context context:primary-signature \
              --verbose=4 "$dmg"
            mount_point="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg" >/dev/null
            app="$mount_point/Otto.app"
            native_runtime="$app/Contents/Resources/otto-native/darwin-${arch}/otto-native"
            sqlcipher_runtime="$app/Contents/Resources/sqlcipher/better_sqlite3.node"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --verify --strict --verbose=2 "$native_runtime"
            codesign --verify --strict --verbose=2 "$sqlcipher_runtime"
            node packages/desktop/scripts/verify-packaged-otto-native.mjs \
              "$app/Contents/Resources/app.asar" \
              --platform darwin \
              --arch "$arch" \
              --expected-build-commit "${{ needs.validate-source.outputs.source_commit }}" \
              --packaged \
              --require-code-signature
            node packages/desktop/scripts/verify-packaged-runtime.mjs \
              "$app/Contents/Resources/app.asar" \
              --platform darwin \
              --arch "$arch" \
              --expected-build-commit "${{ needs.validate-source.outputs.source_commit }}" \
              --require-native-code-signature
            hdiutil detach "$mount_point"
            rmdir "$mount_point"
          done

      - name: Build enterprise server package
        if: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) }}
        run: npm run bundle:enterprise
        env:
          OTTO_LICENSE_PUBLIC_KEYS: ${{ secrets.OTTO_LICENSE_PUBLIC_KEYS }}
          OTTO_ENTERPRISE_SIGNING_PRIVATE_KEY: ${{ secrets.OTTO_ENTERPRISE_SIGNING_PRIVATE_KEY }}
          OTTO_RELEASE_CHANNEL: ${{ inputs.release_channel || 'stable' }}

      - name: Verify release artifacts
        id: artifacts
        shell: bash
        env:
          OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY: ${{ secrets.OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY }}
          OTTO_ENTERPRISE_SIGNING_PRIVATE_KEY: ${{ secrets.OTTO_ENTERPRISE_SIGNING_PRIVATE_KEY }}
          DESKTOP_TEST_BUILD: ${{ inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true && '1' || '0' }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate-source.outputs.version }}"
          SOURCE_COMMIT="${{ needs.validate-source.outputs.source_commit }}"
          DESKTOP_RELEASE="packages/desktop/release"
          test -f "$DESKTOP_RELEASE/Otto-${VERSION}-arm64.dmg"
          test -f "$DESKTOP_RELEASE/Otto-${VERSION}-x64.dmg"
          test -f "$DESKTOP_RELEASE/Otto-Setup-${VERSION}-win-x64.exe"
          test -f "$DESKTOP_RELEASE/latest.json"
          test -f "$DESKTOP_RELEASE/latest.mirror.json"
          node packages/desktop/scripts/verify-update-manifest.mjs "$DESKTOP_RELEASE" "$VERSION"
          DESKTOP_FILES=(
            "$DESKTOP_RELEASE/Otto-${VERSION}-arm64.dmg"
            "$DESKTOP_RELEASE/Otto-${VERSION}-arm64.dmg.blockmap"
            "$DESKTOP_RELEASE/Otto-${VERSION}-x64.dmg"
            "$DESKTOP_RELEASE/Otto-${VERSION}-x64.dmg.blockmap"
            "$DESKTOP_RELEASE/Otto-Setup-${VERSION}-win-x64.exe"
            "$DESKTOP_RELEASE/Otto-Setup-${VERSION}-win-x64.exe.blockmap"
            "$DESKTOP_RELEASE/latest.json"
          )
          FILES=("${DESKTOP_FILES[@]}")
          PACKAGE_ID=""
          if [ "$DESKTOP_TEST_BUILD" != "1" ]; then
            mapfile -d '' ENTERPRISE_ARCHIVES < <(
              find deliverables -maxdepth 1 -type f \
                -name "otto-enterprise-oneclick-v${VERSION}-*.tar.gz" -print0
            )
            [ "${#ENTERPRISE_ARCHIVES[@]}" -eq 1 ]
            ENTERPRISE_ARCHIVE="${ENTERPRISE_ARCHIVES[0]}"
            ENTERPRISE_BASENAME="$(basename "$ENTERPRISE_ARCHIVE")"
            if [[ "$ENTERPRISE_BASENAME" =~ ^otto-enterprise-oneclick-v([0-9]+\.[0-9]+\.[0-9]+)-([0-9a-f]{12}-[0-9a-f]{12})\.tar\.gz$ ]]; then
              [ "${BASH_REMATCH[1]}" = "$VERSION" ]
              PACKAGE_ID="${BASH_REMATCH[2]}"
            else
              echo "Enterprise archive identity is invalid: $ENTERPRISE_BASENAME" >&2
              exit 1
            fi
            ENTERPRISE_SHA="${ENTERPRISE_ARCHIVE}.sha256"
            ENTERPRISE_SIGNATURE="${ENTERPRISE_ARCHIVE}.sig"
            test -f "$ENTERPRISE_ARCHIVE"
            test -f "$ENTERPRISE_SHA"
            test -f "$ENTERPRISE_SIGNATURE"
            (
              cd "$(dirname -- "$ENTERPRISE_SHA")"
              sha256sum -c -- "$(basename -- "$ENTERPRISE_SHA")"
            )
            node scripts/verify-enterprise-package-signature.mjs \
              "$ENTERPRISE_ARCHIVE" "$ENTERPRISE_SIGNATURE"
            FILES+=("$ENTERPRISE_ARCHIVE" "$ENTERPRISE_SHA" "$ENTERPRISE_SIGNATURE")
          fi
          CHECKSUMS="$DESKTOP_RELEASE/SHA256SUMS"
          : > "$CHECKSUMS"
          for artifact in "${FILES[@]}"; do
            printf '%s  %s\n' \
              "$(shasum -a 256 "$artifact" | awk '{print $1}')" \
              "$(basename "$artifact")" >> "$CHECKSUMS"
          done
          FILES+=("$CHECKSUMS")
          # This mirror-only manifest is attested and transferred between jobs,
          # but it is intentionally excluded from SHA256SUMS and the exact
          # public GitHub Release asset set.
          FILES+=("$DESKTOP_RELEASE/latest.mirror.json")
          if [ "$DESKTOP_TEST_BUILD" != "1" ]; then
            CHECKSUM_SIGNATURE="${CHECKSUMS}.sig"
            node scripts/release-payload-signature.mjs sign \
              "$CHECKSUMS" "$CHECKSUM_SIGNATURE"
            node scripts/release-payload-signature.mjs verify \
              "$CHECKSUMS" "$CHECKSUM_SIGNATURE"
            FILES+=("$CHECKSUM_SIGNATURE")

            MIRROR_CHECKSUMS="$DESKTOP_RELEASE/UPDATE-MIRROR-SHA256SUMS"
            MIRROR_PAYLOAD_DIR="$RUNNER_TEMP/otto-v${VERSION}-mirror-payload"
            install -d -m 0700 "$MIRROR_PAYLOAD_DIR"
            for artifact in "${DESKTOP_FILES[@]:0:6}"; do
              cp -- "$artifact" "$MIRROR_PAYLOAD_DIR/"
            done
            cp -- "$DESKTOP_RELEASE/latest.mirror.json" \
              "$MIRROR_PAYLOAD_DIR/latest.json"
            node packages/desktop/scripts/verify-update-manifest.mjs \
              "$MIRROR_PAYLOAD_DIR" "$VERSION"
            node scripts/update-mirror-manifest.mjs create \
              "$MIRROR_PAYLOAD_DIR" "$MIRROR_CHECKSUMS" \
              "$VERSION" "$PACKAGE_ID" "$SOURCE_COMMIT"
            MIRROR_SIGNATURE="${MIRROR_CHECKSUMS}.sig"
            node scripts/release-payload-signature.mjs sign \
              "$MIRROR_CHECKSUMS" "$MIRROR_SIGNATURE"
            node scripts/release-payload-signature.mjs verify \
              "$MIRROR_CHECKSUMS" "$MIRROR_SIGNATURE"
            node scripts/update-mirror-manifest.mjs verify \
              "$MIRROR_CHECKSUMS" "$MIRROR_PAYLOAD_DIR" \
              "$VERSION" "$PACKAGE_ID" "$SOURCE_COMMIT"
            FILES+=(
              "$MIRROR_CHECKSUMS"
              "$MIRROR_SIGNATURE"
            )
          fi
          FILE_LIST="$RUNNER_TEMP/otto-v${VERSION}-release-files.txt"
          printf '%s\n' "${FILES[@]}" > "$FILE_LIST"
          {
            echo "files<<EOF"
            printf '%s\n' "${FILES[@]}"
            echo "EOF"
            echo "file_list=$FILE_LIST"
            echo "package_identity=$PACKAGE_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Attest desktop release candidate provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            packages/desktop/release/Otto-${{ needs.validate-source.outputs.version }}-arm64.dmg
            packages/desktop/release/Otto-${{ needs.validate-source.outputs.version }}-arm64.dmg.blockmap
            packages/desktop/release/Otto-${{ needs.validate-source.outputs.version }}-x64.dmg
            packages/desktop/release/Otto-${{ needs.validate-source.outputs.version }}-x64.dmg.blockmap
            packages/desktop/release/Otto-Setup-${{ needs.validate-source.outputs.version }}-win-x64.exe
            packages/desktop/release/Otto-Setup-${{ needs.validate-source.outputs.version }}-win-x64.exe.blockmap
            packages/desktop/release/latest.json
            packages/desktop/release/latest.mirror.json
            packages/desktop/release/SHA256SUMS

      - name: Attest enterprise release candidate provenance
        if: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            deliverables/otto-enterprise-oneclick-v${{ needs.validate-source.outputs.version }}-*.tar.gz
            deliverables/otto-enterprise-oneclick-v${{ needs.validate-source.outputs.version }}-*.tar.gz.sha256
            deliverables/otto-enterprise-oneclick-v${{ needs.validate-source.outputs.version }}-*.tar.gz.sig

      - name: Attest signed release manifests
        if: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            packages/desktop/release/SHA256SUMS.sig
            packages/desktop/release/UPDATE-MIRROR-SHA256SUMS
            packages/desktop/release/UPDATE-MIRROR-SHA256SUMS.sig

      - name: Verify final release candidate provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r artifact; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done < "${{ steps.artifacts.outputs.file_list }}"

      - name: Generate release notes
        id: release_notes
        shell: bash
        env:
          DESKTOP_TEST_BUILD: ${{ inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true && '1' || '0' }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate-source.outputs.version }}"
          INSTALLER="packages/desktop/release/Otto-Setup-${VERSION}-win-x64.exe"
          INSTALLER_SHA="$(shasum -a 256 "$INSTALLER" | awk '{print $1}')"
          NOTES_FILE="packages/desktop/release/release-notes.md"
          if [ "$DESKTOP_TEST_BUILD" = "1" ]; then
            {
              echo "## Otto v${VERSION} unsigned transition test candidate"
              echo
              echo "Source commit: \`${{ needs.validate-source.outputs.source_commit }}\`"
              echo
              echo "This draft/prerelease contains unsigned Windows and macOS test artifacts. It is not a production release and is not offered through automatic update."
              echo "The production update mirror and enterprise server remain on the previously published stable version. No enterprise server package is attached."
              echo
              echo "Windows installer SHA256: \`${INSTALLER_SHA}\`"
              echo "Verify every attached artifact against \`SHA256SUMS\` and its GitHub build-provenance attestation before testing."
            } > "$NOTES_FILE"
          else
            {
              echo "## Otto v${VERSION}"
              echo
              echo "Source commit: \`${{ needs.validate-source.outputs.source_commit }}\`"
              echo
              echo "### Windows no-proxy download"
              echo
              echo "[Download Windows x64 installer from the Otto mirror](${UPDATE_MIRROR_ASSET_BASE_URL}/Otto-Setup-${VERSION}-win-x64.exe)"
              echo
              echo "SHA256: \`${INSTALLER_SHA}\`"
              echo
              echo "Windows Authenticode and macOS Developer ID/notarization are mandatory release gates."
              echo "The release workflow also verifies SHA-256 checksums, build provenance, SQLCipher provenance and SBOMs, the desktop update manifest, the enterprise Ed25519 package signature, and the License public-key trust anchor."
              echo
              echo "Desktop installers, update manifest, and enterprise one-click package are attached to this release."
            } > "$NOTES_FILE"
          fi
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: otto-release-v${{ needs.validate-source.outputs.version }}
          path: |
            packages/desktop/release/*
            deliverables/otto-enterprise-oneclick-v${{ needs.validate-source.outputs.version }}-*.tar.gz
            deliverables/otto-enterprise-oneclick-v${{ needs.validate-source.outputs.version }}-*.tar.gz.sha256
            deliverables/otto-enterprise-oneclick-v${{ needs.validate-source.outputs.version }}-*.tar.gz.sig
          retention-days: 30

  verify-windows-signature:
    name: Verify Windows installer and packaged runtime
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    env:
      DESKTOP_TEST_BUILD: ${{ inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true && '1' || '0' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify locked JavaScript toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Install locked JavaScript runtime
        run: npm ci --ignore-scripts

      - name: Download release workflow artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: otto-release-v${{ needs.build.outputs.version }}
          path: release-download

      - name: Require a valid Authenticode chain
        if: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release-download -Recurse `
            -Filter 'Otto-Setup-${{ needs.build.outputs.version }}-win-x64.exe' |
            Select-Object -First 1
          if (-not $installer) { throw 'Windows installer is missing' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) {
            throw "Windows Authenticode verification failed: $($signature.Status) $($signature.StatusMessage)"
          }
          Write-Host "Authenticode signer: $($signature.SignerCertificate.Subject)"

      - name: Install and load the packaged SQLCipher binding
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release-download -Recurse `
            -Filter 'Otto-Setup-${{ needs.build.outputs.version }}-win-x64.exe' |
            Select-Object -First 1
          if (-not $installer) { throw 'Windows installer is missing' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'otto-packaged-runtime'
          $process = Start-Process -FilePath $installer.FullName -Wait -PassThru `
            -ArgumentList @('/S', "/D=$installRoot")
          if ($process.ExitCode -ne 0) {
            throw "Silent installer failed: $($process.ExitCode)"
          }
          $electron = Join-Path $installRoot 'Otto.exe'
          $binding = Join-Path $installRoot 'resources\sqlcipher\better_sqlite3.node'
          $nativeRuntime = Join-Path $installRoot 'resources\otto-native\win32-x64\otto-native.exe'
          if (-not (Test-Path -LiteralPath $electron)) { throw 'Installed Otto.exe is missing' }
          if (-not (Test-Path -LiteralPath $binding)) { throw 'Installed SQLCipher binding is missing' }
          if (-not (Test-Path -LiteralPath $nativeRuntime)) { throw 'Installed Otto native runtime is missing' }
          if ($env:DESKTOP_TEST_BUILD -ne '1') {
            $nativeSignature = Get-AuthenticodeSignature -LiteralPath $nativeRuntime
            if ($nativeSignature.Status -ne 'Valid' -or -not $nativeSignature.SignerCertificate) {
              throw "Otto native Authenticode verification failed: $($nativeSignature.Status) $($nativeSignature.StatusMessage)"
            }
            Write-Host "Otto native signer: $($nativeSignature.SignerCertificate.Subject)"
          }
          $env:ELECTRON_RUN_AS_NODE = '1'
          & $electron packages/desktop/scripts/probe-packaged-sqlcipher.mjs `
            --binding $binding
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged SQLCipher runtime probe failed: $LASTEXITCODE"
          }

          $archive = Join-Path $installRoot 'resources\app.asar'
          $verificationArguments = @(
            'packages/desktop/scripts/verify-packaged-runtime.mjs',
            $archive,
            '--platform', 'win32',
            '--arch', 'x64',
            '--expected-build-commit', '${{ needs.build.outputs.source_commit }}',
            '--probe-native',
            '--probe-server-bin'
          )
          if ($env:DESKTOP_TEST_BUILD -ne '1') {
            $verificationArguments += '--require-native-authenticode'
          }
          & $electron @verificationArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged desktop runtime verification failed: $LASTEXITCODE"
          }

  prepare-release-creation-intent:
    name: Lock release creation intent before mutation
    needs:
      - build
      - verify-windows-signature
    runs-on: ubuntu-latest
    environment: production-automation
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      creation_intent_sha256: ${{ steps.capture.outputs.creation_intent_sha256 }}
      pre_public_latest_sha256: ${{ steps.capture.outputs.pre_public_latest_sha256 }}
    env:
      DESKTOP_TEST_BUILD: ${{ inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true && '1' || '0' }}
    steps:
      - name: Reject replayed release creation intent capture
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" != '1' ]; then
            echo 'Release creation intent may only be captured by a fresh audited workflow run.' >&2
            exit 1
          fi

      - name: Checkout exact release source for creation intent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          persist-credentials: false

      - name: Setup locked Node.js runtime for creation intent
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify locked creation intent runtime
        shell: bash
        run: test "$(node --version)" = "v${NODE_VERSION}"

      - name: Revalidate exact source before locking creation intent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOCKED_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          CURRENT_INTERNAL_COMMIT="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/internal" \
            --jq '.object.sha')"
          if [ "$CURRENT_INTERNAL_COMMIT" != "$LOCKED_SOURCE_COMMIT" ]; then
            echo 'origin/internal changed before the release creation intent was locked.' >&2
            echo "locked=$LOCKED_SOURCE_COMMIT current=$CURRENT_INTERNAL_COMMIT" >&2
            exit 1
          fi

      - name: Download immutable release artifact for creation identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: otto-release-v${{ needs.build.outputs.version }}
          path: release-download

      - name: Capture exact release creation intent and pre-public latest
        id: capture
        shell: bash
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          LEGACY_TOKEN: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) && secrets.OTTO_LEGACY_RELEASES_TOKEN || '' }}
          EXPECTED_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease && 'true' || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          TAG="${{ needs.build.outputs.tag }}"
          CANONICAL_TAG_PREEXISTING=false
          if [ "$EVENT_NAME" = 'push' ] && [ "$GITHUB_REF" = "refs/tags/${TAG}" ]; then
            CANONICAL_TAG_PREEXISTING=true
          fi
          ASSET_PROFILE=production
          if [ "$DESKTOP_TEST_BUILD" = '1' ]; then
            ASSET_PROFILE=unsigned-transition
          fi
          install -d -m 0700 release-state
          CAPTURE_JSON="$(node scripts/release-draft-creation-recovery.mjs \
            capture \
            --tag "$TAG" \
            --canonical-repo "$RELEASES_REPO" \
            --legacy-repo "$LEGACY_RELEASES_REPO" \
            --canonical-commit "${{ needs.build.outputs.source_commit }}" \
            --package-identity "${{ needs.build.outputs.package_identity }}" \
            --run-id "$GITHUB_RUN_ID" \
            --artifact-dir release-download \
            --asset-profile "$ASSET_PROFILE" \
            --expected-prerelease "$EXPECTED_PRERELEASE" \
            --canonical-tag-preexisting "$CANONICAL_TAG_PREEXISTING" \
            --intent-file release-state/creation-intent.json \
            --pre-public-latest-file release-state/pre-public-latest.json)"
          CREATION_INTENT_SHA256="$(printf '%s' "$CAPTURE_JSON" | \
            jq -er '.creationIntentSha256')"
          PRE_PUBLIC_LATEST_SHA256="$(printf '%s' "$CAPTURE_JSON" | \
            jq -er '.prePublicLatestSha256')"
          [[ "$CREATION_INTENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRE_PUBLIC_LATEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum release-state/creation-intent.json | awk '{print $1}')" = \
            "$CREATION_INTENT_SHA256"
          test "$(sha256sum release-state/pre-public-latest.json | awk '{print $1}')" = \
            "$PRE_PUBLIC_LATEST_SHA256"
          jq -S '.prePublicLatest' release-state/creation-intent.json > \
            release-state/intent-latest.normalized.json
          jq -S '.' release-state/pre-public-latest.json > \
            release-state/latest.normalized.json
          cmp release-state/intent-latest.normalized.json \
            release-state/latest.normalized.json
          rm -f -- release-state/*.normalized.json
          echo "creation_intent_sha256=$CREATION_INTENT_SHA256" >> "$GITHUB_OUTPUT"
          echo "pre_public_latest_sha256=$PRE_PUBLIC_LATEST_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release creation intent before first mutation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: otto-release-creation-intent-${{ needs.build.outputs.tag }}
          path: release-state
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  create-release-drafts:
    name: Create verified release drafts
    needs:
      - build
      - verify-windows-signature
      - prepare-release-creation-intent
    runs-on: ubuntu-latest
    environment: production-automation
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    outputs:
      creation_intent_sha256: ${{ steps.verify_creation_intent.outputs.creation_intent_sha256 }}
      pre_public_latest_sha256: ${{ steps.verify_creation_intent.outputs.pre_public_latest_sha256 }}
    env:
      DESKTOP_TEST_BUILD: ${{ inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true && '1' || '0' }}
    steps:
      - name: Reject replayed production publication attempts
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" != '1' ]; then
            echo 'Production publication jobs cannot be replayed with Re-run jobs; start a new audited workflow run.' >&2
            exit 1
          fi

      - name: Checkout exact release source for latest-pointer capture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          persist-credentials: false

      - name: Setup locked Node.js runtime for latest-pointer capture
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify locked latest-pointer capture runtime
        shell: bash
        run: test "$(node --version)" = "v${NODE_VERSION}"

      - name: Revalidate exact latest internal source before creating drafts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOCKED_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          set -euo pipefail
          CURRENT_INTERNAL_COMMIT="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/internal" \
            --jq '.object.sha')"
          if [ "$CURRENT_INTERNAL_COMMIT" != "$LOCKED_SOURCE_COMMIT" ]; then
            echo "origin/internal changed while the release candidate was building; refusing stale drafts." >&2
            echo "locked=$LOCKED_SOURCE_COMMIT current=$CURRENT_INTERNAL_COMMIT" >&2
            exit 1
          fi

      - name: Require mutable release settings for latest-pointer compensation
        shell: bash
        env:
          CANONICAL_ADMIN_TOKEN: ${{ secrets.OTTO_CANONICAL_ADMIN_READ_TOKEN }}
          LEGACY_ADMIN_TOKEN: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) && secrets.OTTO_LEGACY_ADMIN_READ_TOKEN || '' }}
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f -- "$RESPONSE_FILE"' EXIT
          request_status() {
            local repository="$1"
            local token="$2"
            local endpoint="$3"
            curl --noproxy '*' --proto '=https' --tlsv1.2 \
              --silent --show-error --max-redirs 0 \
              --connect-timeout 15 --max-time 60 \
              --retry 3 --retry-all-errors \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${token}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --output "$RESPONSE_FILE" \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${repository}${endpoint}"
          }
          require_mutable_releases() {
            local repository="$1"
            local token="$2"
            local status
            test -n "$token"
            status="$(request_status "$repository" "$token" '/actions/permissions')"
            if [ "$status" != '200' ]; then
              echo "Release settings token cannot prove Administration:read for ${repository}; HTTP ${status}." >&2
              exit 1
            fi
            status="$(request_status "$repository" "$token" '/immutable-releases')"
            case "$status" in
              404) ;;
              200)
                echo "Immutable releases are enabled for ${repository}; exact latest-pointer compensation is impossible." >&2
                exit 1
                ;;
              *)
                echo "Could not prove immutable releases are disabled for ${repository}; HTTP ${status}." >&2
                exit 1
                ;;
            esac
          }
          require_mutable_releases "$RELEASES_REPO" "$CANONICAL_ADMIN_TOKEN"
          node scripts/verify-anonymous-github-release-assets.mjs \
            --repo-public "$RELEASES_REPO"
          if [ "$DESKTOP_TEST_BUILD" != '1' ]; then
            require_mutable_releases "$LEGACY_RELEASES_REPO" "$LEGACY_ADMIN_TOKEN"
            node scripts/verify-anonymous-github-release-assets.mjs \
              --repo-public "$LEGACY_RELEASES_REPO"
          fi

      - name: Download verified release workflow artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: otto-release-v${{ needs.build.outputs.version }}
          path: release-download

      - name: Restage and reverify exact release assets
        id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          TAG="${{ needs.build.outputs.tag }}"
          SOURCE_COMMIT="${{ needs.build.outputs.source_commit }}"
          mkdir release-assets
          copy_one() {
            local pattern="$1"
            mapfile -d '' matches < <(find release-download -type f -name "$pattern" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one release artifact matching $pattern, found ${#matches[@]}." >&2
              exit 1
            fi
            cp "${matches[0]}" release-assets/
          }
          copy_one "Otto-${VERSION}-arm64.dmg"
          copy_one "Otto-${VERSION}-arm64.dmg.blockmap"
          copy_one "Otto-${VERSION}-x64.dmg"
          copy_one "Otto-${VERSION}-x64.dmg.blockmap"
          copy_one "Otto-Setup-${VERSION}-win-x64.exe"
          copy_one "Otto-Setup-${VERSION}-win-x64.exe.blockmap"
          copy_one latest.json
          copy_one SHA256SUMS
          if [ "$DESKTOP_TEST_BUILD" = "1" ]; then
            mapfile -d '' enterprise_assets < <(find release-download -type f -name 'otto-enterprise-oneclick-*' -print0)
            if [ "${#enterprise_assets[@]}" -ne 0 ]; then
              echo "Unsigned transition artifact unexpectedly contains an enterprise package." >&2
              exit 1
            fi
            EXPECTED_ASSET_COUNT=8
          else
            copy_one SHA256SUMS.sig
            copy_one UPDATE-MIRROR-SHA256SUMS
            copy_one UPDATE-MIRROR-SHA256SUMS.sig
            copy_one "otto-enterprise-oneclick-v${VERSION}-*.tar.gz"
            copy_one "otto-enterprise-oneclick-v${VERSION}-*.tar.gz.sha256"
            copy_one "otto-enterprise-oneclick-v${VERSION}-*.tar.gz.sig"
            EXPECTED_ASSET_COUNT=14
          fi
          ACTUAL_ASSET_COUNT="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$ACTUAL_ASSET_COUNT" = "$EXPECTED_ASSET_COUNT"
          (
            cd release-assets
            sha256sum -c SHA256SUMS
          )
          OTTO_UPDATE_ASSET_BASE_URL="https://github.com/${RELEASES_REPO}/releases/download/${TAG}" \
            node packages/desktop/scripts/verify-update-manifest.mjs \
            release-assets "$VERSION"
          while IFS= read -r -d '' artifact; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done < <(find release-assets -maxdepth 1 -type f -print0)
          mapfile -d '' notes < <(find release-download -type f -name release-notes.md -print0)
          if [ "${#notes[@]}" -ne 1 ]; then
            echo "Expected exactly one release notes file, found ${#notes[@]}." >&2
            exit 1
          fi
          grep -F "$SOURCE_COMMIT" "${notes[0]}" >/dev/null
          echo "notes=${notes[0]}" >> "$GITHUB_OUTPUT"

      - name: Reject existing release or tag state
        shell: bash
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          LEGACY_TOKEN: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) && secrets.OTTO_LEGACY_RELEASES_TOKEN || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          TAG="${{ needs.build.outputs.tag }}"
          SOURCE_COMMIT="${{ needs.build.outputs.source_commit }}"
          reject_existing() {
            local repository="$1"
            local token="$2"
            local allow_source_tag="$3"
            local refs_json
            local release_ids
            refs_json="$(GH_TOKEN="$token" gh api "repos/${repository}/git/matching-refs/tags/${TAG}")"
            if printf '%s' "$refs_json" | jq -e --arg ref "refs/tags/${TAG}" \
              'any(.[]; .ref == $ref)' >/dev/null; then
              if [ "$allow_source_tag" != "1" ]; then
                echo "Refusing to overwrite existing tag ${repository}:${TAG}." >&2
                exit 1
              fi
              TAG_COMMIT="$(GH_TOKEN="$token" gh api \
                "repos/${repository}/commits/${TAG}" --jq '.sha')"
              if [ "$TAG_COMMIT" != "$SOURCE_COMMIT" ]; then
                echo "Existing source tag ${repository}:${TAG} does not resolve to locked commit ${SOURCE_COMMIT}." >&2
                exit 1
              fi
            fi
            release_ids="$(GH_TOKEN="$token" gh api --paginate \
              "repos/${repository}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG}\") | .id")"
            if [ -n "$release_ids" ]; then
              echo "Refusing to mutate an existing release for ${repository}:${TAG}. Remove the stale draft explicitly after review." >&2
              exit 1
            fi
          }
          ALLOW_CANONICAL_SOURCE_TAG=0
          if [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/tags/${TAG}" ]; then
            ALLOW_CANONICAL_SOURCE_TAG=1
          fi
          reject_existing "$RELEASES_REPO" "$CANONICAL_TOKEN" \
            "$ALLOW_CANONICAL_SOURCE_TAG"
          if [ "$DESKTOP_TEST_BUILD" != "1" ]; then
            reject_existing "$LEGACY_RELEASES_REPO" "$LEGACY_TOKEN" 0
          fi

      - name: Download immutable release creation intent
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: otto-release-creation-intent-${{ needs.build.outputs.tag }}
          path: release-state

      - name: Verify uploaded creation intent immediately before first mutation
        id: verify_creation_intent
        shell: bash
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          LEGACY_TOKEN: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) && secrets.OTTO_LEGACY_RELEASES_TOKEN || '' }}
          CREATION_INTENT_SHA256: ${{ needs.prepare-release-creation-intent.outputs.creation_intent_sha256 }}
          PRE_PUBLIC_LATEST_SHA256: ${{ needs.prepare-release-creation-intent.outputs.pre_public_latest_sha256 }}
        run: |
          set -euo pipefail
          ASSET_PROFILE=production
          if [ "$DESKTOP_TEST_BUILD" = '1' ]; then
            ASSET_PROFILE=unsigned-transition
          fi
          [[ "$CREATION_INTENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRE_PUBLIC_LATEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum release-state/creation-intent.json | awk '{print $1}')" = \
            "$CREATION_INTENT_SHA256"
          test "$(sha256sum release-state/pre-public-latest.json | awk '{print $1}')" = \
            "$PRE_PUBLIC_LATEST_SHA256"
          jq -S '.prePublicLatest' release-state/creation-intent.json > \
            release-state/intent-latest.normalized.json
          jq -S '.' release-state/pre-public-latest.json > \
            release-state/latest.normalized.json
          cmp release-state/intent-latest.normalized.json \
            release-state/latest.normalized.json
          rm -f -- release-state/*.normalized.json
          node scripts/release-draft-creation-recovery.mjs \
            verify-before-create \
            --tag "${{ needs.build.outputs.tag }}" \
            --canonical-repo "$RELEASES_REPO" \
            --legacy-repo "$LEGACY_RELEASES_REPO" \
            --canonical-commit "${{ needs.build.outputs.source_commit }}" \
            --package-identity "${{ needs.build.outputs.package_identity }}" \
            --asset-profile "$ASSET_PROFILE" \
            --run-id "$GITHUB_RUN_ID" \
            --intent-file release-state/creation-intent.json \
            --intent-sha256 "$CREATION_INTENT_SHA256"
          echo "creation_intent_sha256=$CREATION_INTENT_SHA256" >> "$GITHUB_OUTPUT"
          echo "pre_public_latest_sha256=$PRE_PUBLIC_LATEST_SHA256" >> "$GITHUB_OUTPUT"

      - name: Create canonical and compatibility drafts with GitHub CLI
        shell: bash
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          LEGACY_TOKEN: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) && secrets.OTTO_LEGACY_RELEASES_TOKEN || '' }}
          NOTES_FILE: ${{ steps.assets.outputs.notes }}
          EXPECTED_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease && 'true' || 'false' }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          TAG="${{ needs.build.outputs.tag }}"
          SOURCE_COMMIT="${{ needs.build.outputs.source_commit }}"
          PRERELEASE_ARGS=()
          if [ "$EXPECTED_PRERELEASE" = "true" ]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          GH_TOKEN="$CANONICAL_TOKEN" gh release create "$TAG" release-assets/* \
            --repo "$RELEASES_REPO" \
            --target "$SOURCE_COMMIT" \
            --title "Otto v${VERSION}" \
            --draft \
            --notes-file "$NOTES_FILE" \
            "${PRERELEASE_ARGS[@]}"
          if [ "$DESKTOP_TEST_BUILD" != "1" ]; then
            # The legacy public repository intentionally contains assets only;
            # bind its compatibility tag to its own main branch while the body
            # records the immutable canonical source commit.
            GH_TOKEN="$LEGACY_TOKEN" gh release create "$TAG" release-assets/* \
              --repo "$LEGACY_RELEASES_REPO" \
              --target main \
              --title "Otto v${VERSION}" \
              --draft \
              --notes-file "$NOTES_FILE" \
              "${PRERELEASE_ARGS[@]}"
          fi

      - name: Verify immutable draft state before deployment
        shell: bash
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          LEGACY_TOKEN: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) && secrets.OTTO_LEGACY_RELEASES_TOKEN || '' }}
          EXPECTED_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease && 'true' || 'false' }}
          NOTES_FILE: ${{ steps.assets.outputs.notes }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          TAG="${{ needs.build.outputs.tag }}"
          SOURCE_COMMIT="${{ needs.build.outputs.source_commit }}"
          EXPECTED_NAME="Otto v${VERSION}"
          verify_release() {
            local repository="$1"
            local token="$2"
            local expected_target="$3"
            local release_json
            local actual_body_file
            release_json="$(GH_TOKEN="$token" gh api "repos/${repository}/releases/tags/${TAG}")"
            printf '%s' "$release_json" | jq -e \
              --arg target "$expected_target" \
              --arg name "$EXPECTED_NAME" \
              --argjson prerelease "$EXPECTED_PRERELEASE" \
              '.draft == true
               and .prerelease == $prerelease
               and .name == $name
               and .target_commitish == $target
               and all(.assets[]; .state == "uploaded" and .size > 0)' >/dev/null
            actual_body_file="$(mktemp)"
            printf '%s' "$release_json" | jq -j '.body // ""' > "$actual_body_file"
            cmp -- "$NOTES_FILE" "$actual_body_file"
            rm -f -- "$actual_body_file"
            mapfile -t expected_assets < <(
              while IFS= read -r -d '' artifact; do
                printf '%s\t%s\tsha256:%s\n' \
                  "$(basename "$artifact")" \
                  "$(stat -c '%s' "$artifact")" \
                  "$(sha256sum "$artifact" | awk '{print $1}')"
              done < <(find release-assets -maxdepth 1 -type f -print0)
            )
            mapfile -t expected_assets < <(
              printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort
            )
            mapfile -t actual_assets < <(
              printf '%s' "$release_json" | jq -r \
                '.assets[] | [.name, (.size | tostring), (.digest // "")] | @tsv' | \
                LC_ALL=C sort
            )
            if [ "${#actual_assets[@]}" -ne "${#expected_assets[@]}" ]; then
              echo "Release asset count mismatch for ${repository}:${TAG}." >&2
              exit 1
            fi
            for index in "${!expected_assets[@]}"; do
              if [ "${actual_assets[$index]}" != "${expected_assets[$index]}" ]; then
                echo "Release asset mismatch for ${repository}:${TAG}." >&2
                printf 'expected: %s\nactual:   %s\n' \
                  "${expected_assets[$index]}" "${actual_assets[$index]}" >&2
                exit 1
              fi
            done
          }
          verify_release "$RELEASES_REPO" "$CANONICAL_TOKEN" "$SOURCE_COMMIT"
          CANONICAL_TAG_COMMIT="$(GH_TOKEN="$CANONICAL_TOKEN" gh api \
            "repos/${RELEASES_REPO}/commits/${TAG}" --jq '.sha')"
          if [ "$CANONICAL_TAG_COMMIT" != "$SOURCE_COMMIT" ]; then
            echo "Canonical draft tag does not resolve to the locked source commit." >&2
            exit 1
          fi
          if [ "$DESKTOP_TEST_BUILD" = "1" ]; then
            CANONICAL_BODY="$(GH_TOKEN="$CANONICAL_TOKEN" gh api \
              "repos/${RELEASES_REPO}/releases/tags/${TAG}" --jq '.body // ""')"
            printf '%s' "$CANONICAL_BODY" | grep -F \
              'This draft/prerelease contains unsigned Windows and macOS test artifacts.' >/dev/null
            printf '%s' "$CANONICAL_BODY" | grep -F \
              'It is not a production release and is not offered through automatic update.' >/dev/null
            printf '%s' "$CANONICAL_BODY" | grep -F \
              'The production update mirror and enterprise server remain on the previously published stable version.' >/dev/null
          else
            verify_release "$LEGACY_RELEASES_REPO" "$LEGACY_TOKEN" main
            LOCKED_LEGACY_COMMIT="$(jq -er \
              '.legacyMainCommit | select(test("^[0-9a-f]{40}$"))' \
              release-state/creation-intent.json)"
            LEGACY_TAG_COMMIT="$(GH_TOKEN="$LEGACY_TOKEN" gh api \
              "repos/${LEGACY_RELEASES_REPO}/commits/${TAG}" --jq '.sha')"
            if [ "$LEGACY_TAG_COMMIT" != "$LOCKED_LEGACY_COMMIT" ]; then
              echo "Legacy draft tag does not resolve to the commit locked before draft creation." >&2
              exit 1
            fi
          fi

  cleanup-partial-release-drafts:
    name: Remove only this run's partial draft creation
    needs:
      - build
      - prepare-release-creation-intent
      - create-release-drafts
    runs-on: ubuntu-latest
    environment: production-automation
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      DESKTOP_TEST_BUILD: ${{ inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true && '1' || '0' }}
    if: >-
      ${{
        always()
        && needs.build.result == 'success'
        && needs.prepare-release-creation-intent.result == 'success'
        && (
          needs.create-release-drafts.result == 'failure'
          || needs.create-release-drafts.result == 'cancelled'
        )
      }}
    steps:
      - name: Checkout locked draft recovery helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          persist-credentials: false

      - name: Setup locked Node.js runtime for draft recovery
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify locked draft recovery runtime
        shell: bash
        run: test "$(node --version)" = "v${NODE_VERSION}"

      - name: Download immutable pre-mutation creation intent
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: otto-release-creation-intent-${{ needs.build.outputs.tag }}
          path: release-state

      - name: Delete only verified partial drafts and run-created tags
        shell: bash
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          LEGACY_TOKEN: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) && secrets.OTTO_LEGACY_RELEASES_TOKEN || '' }}
          CREATION_INTENT_SHA256: ${{ needs.prepare-release-creation-intent.outputs.creation_intent_sha256 }}
          PRE_PUBLIC_LATEST_SHA256: ${{ needs.prepare-release-creation-intent.outputs.pre_public_latest_sha256 }}
        run: |
          set -euo pipefail
          ASSET_PROFILE=production
          if [ "$DESKTOP_TEST_BUILD" = '1' ]; then
            ASSET_PROFILE=unsigned-transition
          fi
          [[ "$CREATION_INTENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRE_PUBLIC_LATEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum release-state/creation-intent.json | awk '{print $1}')" = \
            "$CREATION_INTENT_SHA256"
          test "$(sha256sum release-state/pre-public-latest.json | awk '{print $1}')" = \
            "$PRE_PUBLIC_LATEST_SHA256"
          jq -S '.prePublicLatest' release-state/creation-intent.json > \
            release-state/intent-latest.normalized.json
          jq -S '.' release-state/pre-public-latest.json > \
            release-state/latest.normalized.json
          cmp release-state/intent-latest.normalized.json \
            release-state/latest.normalized.json
          rm -f -- release-state/*.normalized.json
          node scripts/release-draft-creation-recovery.mjs \
            cleanup \
            --tag "${{ needs.build.outputs.tag }}" \
            --canonical-repo "$RELEASES_REPO" \
            --legacy-repo "$LEGACY_RELEASES_REPO" \
            --canonical-commit "${{ needs.build.outputs.source_commit }}" \
            --package-identity "${{ needs.build.outputs.package_identity }}" \
            --asset-profile "$ASSET_PROFILE" \
            --run-id "$GITHUB_RUN_ID" \
            --intent-file release-state/creation-intent.json \
            --intent-sha256 "$CREATION_INTENT_SHA256"

  validate-deployment-principals:
    name: Validate isolated deployment principals
    needs: validate-source
    runs-on: ubuntu-latest
    environment: production-automation
    timeout-minutes: 10
    permissions: {}
    if: >-
      ${{
        success()
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && !inputs.draft)
        )
      }}
    steps:
      - name: Prove distinct keys and server-side account isolation
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ROLLBACK_DEPLOY_USER: ${{ secrets.ROLLBACK_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ROLLBACK_DEPLOY_SSH_KEY: ${{ secrets.ROLLBACK_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
          [[ "$DEPLOY_HOST" != *'..'* ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ "$ROLLBACK_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [ "$DEPLOY_USER" != "$ROLLBACK_DEPLOY_USER" ]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [ "$DEPLOY_PORT" -ge 1 ] && [ "$DEPLOY_PORT" -le 65535 ]
          test -n "$DEPLOY_SSH_KEY"
          test -n "$ROLLBACK_DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          PRINCIPAL_AUDIT_DIR="$(mktemp -d)"
          chmod 0700 "$PRINCIPAL_AUDIT_DIR"
          trap 'rm -rf -- "$PRINCIPAL_AUDIT_DIR"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$PRINCIPAL_AUDIT_DIR/deploy"
          printf '%s\n' "$ROLLBACK_DEPLOY_SSH_KEY" > "$PRINCIPAL_AUDIT_DIR/rollback"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$PRINCIPAL_AUDIT_DIR/known_hosts"
          DEPLOY_KEY_FINGERPRINT="$(ssh-keygen -y -P '' -f "$PRINCIPAL_AUDIT_DIR/deploy" | \
            ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          ROLLBACK_KEY_FINGERPRINT="$(ssh-keygen -y -P '' -f "$PRINCIPAL_AUDIT_DIR/rollback" | \
            ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          [[ "$DEPLOY_KEY_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          [[ "$ROLLBACK_KEY_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          [ "$DEPLOY_KEY_FINGERPRINT" != "$ROLLBACK_KEY_FINGERPRINT" ]
          SSH_OPTIONS=(
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o "UserKnownHostsFile=$PRINCIPAL_AUDIT_DIR/known_hosts"
          )
          preflight_principal() {
            local key="$1"
            local user="$2"
            local output
            output="$(ssh "${SSH_OPTIONS[@]}" -i "$key" "${user}@${DEPLOY_HOST}" -- \
              /usr/bin/sudo -n -- /usr/local/sbin/otto-enterprise-ci-deploy preflight)"
            [[ "$output" =~ ^protocol=otto-enterprise-ci-deploy-v5\ gateway=[0-9a-f]{64}\ publish=[0-9a-f]{64}\ rollback=[0-9a-f]{64}\ key=[0-9a-f]{16}\ config=/etc/otto-enterprise/enterprise.env\ deploy_user=${DEPLOY_USER}\ rollback_user=${ROLLBACK_DEPLOY_USER}$ ]]
          }
          reject_cross_login() {
            local key="$1"
            local user="$2"
            local stderr_file
            local status
            local cross_attempt
            local -a stderr_lines
            stderr_file="$(mktemp "$PRINCIPAL_AUDIT_DIR/cross-login.XXXXXX")"
            chmod 0600 "$stderr_file"
            for cross_attempt in 1 2 3; do
              : > "$stderr_file"
              status=0
              set +e
              ssh "${SSH_OPTIONS[@]}" -i "$key" \
                -o PreferredAuthentications=publickey \
                -o PasswordAuthentication=no \
                -o KbdInteractiveAuthentication=no \
                "${user}@${DEPLOY_HOST}" -- /usr/bin/true \
                2>"$stderr_file"
              status="$?"
              set -e
              mapfile -t stderr_lines < <(
                sed -e 's/\r$//' -e '/^[[:space:]]*$/d' "$stderr_file"
              )
              if [ "$status" -ne 255 ] || [ "${#stderr_lines[@]}" -ne 1 ]; then
                echo "Cross-login probe was not an unambiguous public-key rejection; attempt=${cross_attempt} status=${status} stderr_lines=${#stderr_lines[@]}." >&2
                return 1
              fi
              if [[ ! "${stderr_lines[0]}" =~ ^[^[:space:]]+:\ Permission\ denied\ \(publickey\)\.$ ]]; then
                echo "Cross-login probe returned an ambiguous SSH failure on attempt ${cross_attempt}." >&2
                return 1
              fi
              if [ "$cross_attempt" -lt 3 ]; then
                sleep 1
              fi
            done
            rm -f -- "$stderr_file"
          }
          preflight_principal "$PRINCIPAL_AUDIT_DIR/deploy" "$DEPLOY_USER"
          preflight_principal "$PRINCIPAL_AUDIT_DIR/rollback" "$ROLLBACK_DEPLOY_USER"
          reject_cross_login "$PRINCIPAL_AUDIT_DIR/deploy" "$ROLLBACK_DEPLOY_USER"
          reject_cross_login "$PRINCIPAL_AUDIT_DIR/rollback" "$DEPLOY_USER"

  deploy-enterprise:
    name: Deploy Enterprise Server
    needs:
      - build
      - verify-windows-signature
      - create-release-drafts
      - validate-deployment-principals
    permissions:
      contents: read
    if: >-
      ${{
        success()
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && !inputs.draft)
        )
      }}
    uses: ./.github/workflows/deploy-server.yml
    with:
      version: ${{ needs.build.outputs.version }}
      package_identity: ${{ needs.build.outputs.package_identity }}
      source_commit: ${{ needs.build.outputs.source_commit }}
      dry_run: false
      release_repository: NSIETeam/otto-new
      use_workflow_artifact: true
      defer_finalize: true

  deploy-update-mirror:
    name: Deploy Desktop Update Mirror
    needs:
      - build
      - verify-windows-signature
      - deploy-enterprise
      - publish-canonical
    runs-on: ubuntu-latest
    environment: production-automation
    timeout-minutes: 90
    permissions:
      contents: read
    if: >-
      ${{
        success()
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && !inputs.draft)
        )
      }}
    steps:
      - name: Reject replayed production mirror attempts
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" != '1' ]; then
            echo 'Production mirror jobs cannot be replayed with Re-run jobs; start a new audited workflow run.' >&2
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup locked Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify locked Node.js runtime
        shell: bash
        run: test "$(node --version)" = "v${NODE_VERSION}"

      - name: Validate deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ROLLBACK_DEPLOY_USER: ${{ secrets.ROLLBACK_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
          [[ "$DEPLOY_HOST" != *'..'* ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ "$ROLLBACK_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [ "$DEPLOY_USER" != "$ROLLBACK_DEPLOY_USER" ]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [ "$DEPLOY_PORT" -ge 1 ] && [ "$DEPLOY_PORT" -le 65535 ]
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          KEY_AUDIT_DIR="$(mktemp -d)"
          chmod 0700 "$KEY_AUDIT_DIR"
          trap 'rm -rf -- "$KEY_AUDIT_DIR"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY_AUDIT_DIR/deploy"
          DEPLOY_KEY_FINGERPRINT="$(ssh-keygen -y -P '' -f "$KEY_AUDIT_DIR/deploy" | \
            ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          [[ "$DEPLOY_KEY_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]

      - name: Download release workflow artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: otto-release-v${{ needs.build.outputs.version }}
          path: release-download

      - name: Prepare and verify mirror payload
        shell: bash
        env:
          OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY: ${{ secrets.OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          PACKAGE_ID="${{ needs.build.outputs.package_identity }}"
          SOURCE_COMMIT="${{ needs.build.outputs.source_commit }}"
          mkdir -p mirror-upload
          copy_one() {
            local pattern="$1"
            local -a matches
            mapfile -d '' matches < <(
              find release-download -type f -name "$pattern" -print0
            )
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one mirror artifact matching $pattern, found ${#matches[@]}." >&2
              exit 1
            fi
            cp -- "${matches[0]}" mirror-upload/
          }
          copy_one "Otto-${VERSION}-arm64.dmg"
          copy_one "Otto-${VERSION}-arm64.dmg.blockmap"
          copy_one "Otto-${VERSION}-x64.dmg"
          copy_one "Otto-${VERSION}-x64.dmg.blockmap"
          copy_one "Otto-Setup-${VERSION}-win-x64.exe"
          copy_one "Otto-Setup-${VERSION}-win-x64.exe.blockmap"
          copy_one "latest.mirror.json"
          mv -- mirror-upload/latest.mirror.json mirror-upload/latest.json
          copy_one "UPDATE-MIRROR-SHA256SUMS"
          copy_one "UPDATE-MIRROR-SHA256SUMS.sig"
          node packages/desktop/scripts/verify-update-manifest.mjs "mirror-upload" "$VERSION"
          node scripts/release-payload-signature.mjs verify \
            mirror-upload/UPDATE-MIRROR-SHA256SUMS \
            mirror-upload/UPDATE-MIRROR-SHA256SUMS.sig
          node scripts/update-mirror-manifest.mjs verify \
            mirror-upload/UPDATE-MIRROR-SHA256SUMS mirror-upload \
            "$VERSION" "$PACKAGE_ID" "$SOURCE_COMMIT"

      - name: Configure SSH
        id: mirror_ssh
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 0600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Upload and atomically publish mirror
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ROLLBACK_DEPLOY_USER: ${{ secrets.ROLLBACK_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY: ${{ secrets.OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY }}
          CANONICAL_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          TAG="${{ needs.build.outputs.tag }}"
          SOURCE_COMMIT="${{ needs.build.outputs.source_commit }}"
          EXPECTED_NAME="Otto v${VERSION}"
          EXPECTED_PATTERNS=(
            "Otto-${VERSION}-arm64.dmg"
            "Otto-${VERSION}-arm64.dmg.blockmap"
            "Otto-${VERSION}-x64.dmg"
            "Otto-${VERSION}-x64.dmg.blockmap"
            "Otto-Setup-${VERSION}-win-x64.exe"
            "Otto-Setup-${VERSION}-win-x64.exe.blockmap"
            'latest.json'
            'SHA256SUMS'
            'SHA256SUMS.sig'
            'UPDATE-MIRROR-SHA256SUMS'
            'UPDATE-MIRROR-SHA256SUMS.sig'
            "otto-enterprise-oneclick-v${VERSION}-*.tar.gz"
            "otto-enterprise-oneclick-v${VERSION}-*.tar.gz.sha256"
            "otto-enterprise-oneclick-v${VERSION}-*.tar.gz.sig"
          )
          expected_assets=()
          for pattern in "${EXPECTED_PATTERNS[@]}"; do
            mapfile -d '' matches < <(find release-download -type f -name "$pattern" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one immutable release artifact matching $pattern, found ${#matches[@]}." >&2
              exit 1
            fi
            expected_assets+=("$(printf '%s\t%s\tsha256:%s' \
              "$(basename "${matches[0]}")" \
              "$(stat -c '%s' "${matches[0]}")" \
              "$(sha256sum "${matches[0]}" | awk '{print $1}')")")
          done
          mapfile -t expected_assets < <(
            printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort
          )
          mapfile -d '' notes < <(find release-download -type f -name release-notes.md -print0)
          [ "${#notes[@]}" -eq 1 ]
          NOTES_FILE="${notes[0]}"
          verify_public_release() {
            local repository="$1"
            local token="$2"
            local expected_target="$3"
            local release_json
            local body_file
            local expected_release_id
            local latest_json
            release_json="$(GH_TOKEN="$token" gh api "repos/${repository}/releases/tags/${TAG}")"
            printf '%s' "$release_json" | jq -e \
              --arg target "$expected_target" --arg name "$EXPECTED_NAME" \
              '.draft == false
               and .prerelease == false
               and .name == $name
               and .target_commitish == $target
               and all(.assets[]; .state == "uploaded" and .size > 0)' >/dev/null
            body_file="$(mktemp)"
            printf '%s' "$release_json" | jq -j '.body // ""' > "$body_file"
            cmp -- "$NOTES_FILE" "$body_file"
            rm -f -- "$body_file"
            mapfile -t actual_assets < <(
              printf '%s' "$release_json" | jq -r \
                '.assets[] | [.name, (.size | tostring), (.digest // "")] | @tsv' | \
                LC_ALL=C sort
            )
            [ "${#actual_assets[@]}" -eq "${#expected_assets[@]}" ]
            for index in "${!expected_assets[@]}"; do
              if [ "${actual_assets[$index]}" != "${expected_assets[$index]}" ]; then
                echo "Public Release asset identity changed for ${repository}:${TAG}." >&2
                exit 1
              fi
            done
            expected_release_id="$(printf '%s' "$release_json" | jq -er '.id')"
            for attempt in 1 2 3 4 5 6; do
              if latest_json="$(GH_TOKEN="$token" gh api \
                "repos/${repository}/releases/latest" 2>/dev/null)" \
                && printf '%s' "$latest_json" | jq -e \
                  --argjson id "$expected_release_id" --arg tag "$TAG" \
                  '.id == $id and .tag_name == $tag
                   and .draft == false and .prerelease == false' >/dev/null; then
                return 0
              fi
              [ "$attempt" -lt 6 ] && sleep 5
            done
            echo "Latest Release identity did not converge to ${repository}:${TAG} id=${expected_release_id}." >&2
            exit 1
          }
          verify_public_release "$RELEASES_REPO" "$CANONICAL_TOKEN" "$SOURCE_COMMIT"
          CANONICAL_TAG_COMMIT="$(GH_TOKEN="$CANONICAL_TOKEN" gh api \
            "repos/${RELEASES_REPO}/commits/${TAG}" --jq '.sha')"
          [ "$CANONICAL_TAG_COMMIT" = "$SOURCE_COMMIT" ]

          MIRROR_TRANSACTION_ID="${{ needs.build.outputs.tag }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$MIRROR_TRANSACTION_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-[0-9]+$ ]]
          SSH_OPTIONS=(
            -i ~/.ssh/id_deploy
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )
          EXPECTED_KEY_ID="$(printf '%s\n' "$OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY" | \
            openssl pkey -pubin -outform DER | sha256sum | awk '{print substr($1,1,16)}')"
          EXPECTED_PREFLIGHT="protocol=otto-enterprise-ci-deploy-v5 gateway=$(sha256sum deployment/enterprise-oneclick/ci-deploy-gateway.sh | awk '{print $1}') publish=$(sha256sum deployment/enterprise-oneclick/ci/publish-update-mirror.sh | awk '{print $1}') rollback=$(sha256sum deployment/enterprise-oneclick/ci/rollback-update-mirror.sh | awk '{print $1}') key=${EXPECTED_KEY_ID} config=/etc/otto-enterprise/enterprise.env deploy_user=${DEPLOY_USER} rollback_user=${ROLLBACK_DEPLOY_USER}"
          ACTUAL_PREFLIGHT="$(ssh "${SSH_OPTIONS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" -- \
            /usr/bin/sudo -n -- /usr/local/sbin/otto-enterprise-ci-deploy \
            preflight)"
          if [ "$ACTUAL_PREFLIGHT" != "$EXPECTED_PREFLIGHT" ]; then
            echo 'Installed root gateway, helpers, or signing trust anchor do not match the locked release source.' >&2
            printf 'expected: %s\nactual:   %s\n' "$EXPECTED_PREFLIGHT" "$ACTUAL_PREFLIGHT" >&2
            exit 1
          fi
          ssh "${SSH_OPTIONS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" -- \
            /usr/bin/sudo -n -- /usr/local/sbin/otto-enterprise-ci-deploy \
            prepare-upload mirror "$MIRROR_TRANSACTION_ID"
          upload_file() {
            local role="$1"
            local file="$2"
            local size
            local digest
            local expected_receipt
            local actual_receipt
            size="$(stat -c '%s' -- "$file")"
            digest="$(sha256sum -- "$file" | awk '{print $1}')"
            expected_receipt="uploaded kind=mirror transaction=${MIRROR_TRANSACTION_ID} role=${role} size=${size} sha256=${digest}"
            actual_receipt="$(ssh "${SSH_OPTIONS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" -- \
              /usr/bin/sudo -n -- /usr/local/sbin/otto-enterprise-ci-deploy \
              upload-file mirror "$MIRROR_TRANSACTION_ID" "$role" "$size" "$digest" \
              < "$file")"
            [ "$actual_receipt" = "$expected_receipt" ]
          }
          upload_file mac-arm64-installer "mirror-upload/Otto-${VERSION}-arm64.dmg"
          upload_file mac-arm64-blockmap "mirror-upload/Otto-${VERSION}-arm64.dmg.blockmap"
          upload_file mac-x64-installer "mirror-upload/Otto-${VERSION}-x64.dmg"
          upload_file mac-x64-blockmap "mirror-upload/Otto-${VERSION}-x64.dmg.blockmap"
          upload_file windows-x64-installer "mirror-upload/Otto-Setup-${VERSION}-win-x64.exe"
          upload_file windows-x64-blockmap "mirror-upload/Otto-Setup-${VERSION}-win-x64.exe.blockmap"
          upload_file latest-manifest mirror-upload/latest.json
          upload_file payload-checksums mirror-upload/UPDATE-MIRROR-SHA256SUMS
          upload_file payload-signature mirror-upload/UPDATE-MIRROR-SHA256SUMS.sig
          ssh "${SSH_OPTIONS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" -- \
            /usr/bin/sudo -n -- /usr/local/sbin/otto-enterprise-ci-deploy \
            publish-mirror "$MIRROR_TRANSACTION_ID" \
            "${{ needs.build.outputs.version }}" \
            "${{ needs.build.outputs.package_identity }}" \
            "${{ needs.build.outputs.source_commit }}"

      - name: Verify public mirror
        shell: bash
        run: |
          set -euo pipefail
          curl --noproxy '*' --proto '=https' --tlsv1.2 \
            --fail-with-body --silent --show-error --max-redirs 0 \
            --connect-timeout 15 --max-time 120 --retry 3 --retry-all-errors \
            "${UPDATE_MIRROR_MANIFEST_URL}?run=${GITHUB_RUN_ID}" \
            --output remote-latest.json
          cmp mirror-upload/latest.json remote-latest.json
          VERSION="${{ needs.build.outputs.version }}"
          MIRROR_ASSETS=(
            "Otto-${VERSION}-arm64.dmg"
            "Otto-${VERSION}-arm64.dmg.blockmap"
            "Otto-${VERSION}-x64.dmg"
            "Otto-${VERSION}-x64.dmg.blockmap"
            "Otto-Setup-${VERSION}-win-x64.exe"
            "Otto-Setup-${VERSION}-win-x64.exe.blockmap"
          )
          mkdir remote-mirror-assets
          for asset in "${MIRROR_ASSETS[@]}"; do
            curl --noproxy '*' --proto '=https' --tlsv1.2 \
              --fail-with-body --silent --show-error --max-redirs 0 \
              --connect-timeout 15 --max-time 900 --retry 3 --retry-all-errors \
              "${UPDATE_MIRROR_ASSET_BASE_URL}/${asset}?run=${GITHUB_RUN_ID}" \
              --output "remote-mirror-assets/${asset}"
            expected_sha256="$(sha256sum "mirror-upload/${asset}" | awk '{print $1}')"
            echo "${expected_sha256}  remote-mirror-assets/${asset}" | sha256sum -c -
          done

      - name: Remove mirror upload transaction
        if: ${{ always() && steps.mirror_ssh.outcome == 'success' }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          MIRROR_TRANSACTION_ID="${{ needs.build.outputs.tag }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" -- \
            /usr/bin/sudo -n -- /usr/local/sbin/otto-enterprise-ci-deploy \
            cleanup-upload mirror "$MIRROR_TRANSACTION_ID"

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f -- ~/.ssh/id_deploy ~/.ssh/known_hosts

  publish-canonical:
    name: Publish and verify canonical Release
    needs:
      - build
      - verify-windows-signature
      - create-release-drafts
      - deploy-enterprise
      - validate-deployment-principals
    runs-on: ubuntu-latest
    environment: production-automation
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: read
    if: >-
      ${{
        always()
        && !cancelled()
        && needs.build.result == 'success'
        && needs.verify-windows-signature.result == 'success'
        && needs.create-release-drafts.result == 'success'
        && needs.deploy-enterprise.result == 'success'
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && !inputs.draft)
        )
      }}
    steps:
      - name: Reject replayed production publication attempts
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" != '1' ]; then
            echo 'Production publication jobs cannot be replayed with Re-run jobs; start a new audited workflow run.' >&2
            exit 1
          fi

      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.source_commit }}

      - name: Setup locked Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify locked Node.js runtime
        shell: bash
        run: test "$(node --version)" = "v${NODE_VERSION}"

      - name: Reconfirm mutable release settings before publication
        shell: bash
        env:
          CANONICAL_ADMIN_TOKEN: ${{ secrets.OTTO_CANONICAL_ADMIN_READ_TOKEN }}
          LEGACY_ADMIN_TOKEN: ${{ secrets.OTTO_LEGACY_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f -- "$RESPONSE_FILE"' EXIT
          request_status() {
            local repository="$1"
            local token="$2"
            local endpoint="$3"
            curl --noproxy '*' --proto '=https' --tlsv1.2 \
              --silent --show-error --max-redirs 0 \
              --connect-timeout 15 --max-time 60 \
              --retry 3 --retry-all-errors \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${token}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --output "$RESPONSE_FILE" \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${repository}${endpoint}"
          }
          require_mutable_releases() {
            local repository="$1"
            local token="$2"
            local status
            test -n "$token"
            status="$(request_status "$repository" "$token" '/actions/permissions')"
            if [ "$status" != '200' ]; then
              echo "Release settings token cannot prove Administration:read for ${repository}; HTTP ${status}." >&2
              exit 1
            fi
            status="$(request_status "$repository" "$token" '/immutable-releases')"
            case "$status" in
              404) ;;
              200)
                echo "Immutable releases are enabled for ${repository}; exact latest-pointer compensation is impossible." >&2
                exit 1
                ;;
              *)
                echo "Could not prove immutable releases are disabled for ${repository}; HTTP ${status}." >&2
                exit 1
                ;;
            esac
          }
          require_mutable_releases "$RELEASES_REPO" "$CANONICAL_ADMIN_TOKEN"
          require_mutable_releases "$LEGACY_RELEASES_REPO" "$LEGACY_ADMIN_TOKEN"
          node scripts/verify-anonymous-github-release-assets.mjs \
            --repo-public "$RELEASES_REPO"
          node scripts/verify-anonymous-github-release-assets.mjs \
            --repo-public "$LEGACY_RELEASES_REPO"

      - name: Download immutable release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: otto-release-v${{ needs.build.outputs.version }}
          path: release-download

      - name: Download immutable release creation intent
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: otto-release-creation-intent-${{ needs.build.outputs.tag }}
          path: release-state

      - name: Reverify, publish, and reverify canonical release endpoint
        shell: bash
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          LEGACY_TOKEN: ${{ secrets.OTTO_LEGACY_RELEASES_TOKEN }}
          OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY: ${{ secrets.OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY }}
          EXPECTED_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease && 'true' || 'false' }}
          PRE_PUBLIC_LATEST_SHA256: ${{ needs.create-release-drafts.outputs.pre_public_latest_sha256 }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          SOURCE_COMMIT="${{ needs.build.outputs.source_commit }}"
          PACKAGE_ID="${{ needs.build.outputs.package_identity }}"
          TAG="${{ needs.build.outputs.tag }}"
          mkdir release-assets
          copy_one() {
            local pattern="$1"
            mapfile -d '' matches < <(find release-download -type f -name "$pattern" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one immutable release artifact matching $pattern, found ${#matches[@]}." >&2
              exit 1
            fi
            cp "${matches[0]}" release-assets/
          }
          copy_one "Otto-${VERSION}-arm64.dmg"
          copy_one "Otto-${VERSION}-arm64.dmg.blockmap"
          copy_one "Otto-${VERSION}-x64.dmg"
          copy_one "Otto-${VERSION}-x64.dmg.blockmap"
          copy_one "Otto-Setup-${VERSION}-win-x64.exe"
          copy_one "Otto-Setup-${VERSION}-win-x64.exe.blockmap"
          copy_one latest.json
          copy_one SHA256SUMS
          copy_one SHA256SUMS.sig
          copy_one UPDATE-MIRROR-SHA256SUMS
          copy_one UPDATE-MIRROR-SHA256SUMS.sig
          copy_one "otto-enterprise-oneclick-v${VERSION}-*.tar.gz"
          copy_one "otto-enterprise-oneclick-v${VERSION}-*.tar.gz.sha256"
          copy_one "otto-enterprise-oneclick-v${VERSION}-*.tar.gz.sig"
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = 14
          (
            cd release-assets
            sha256sum -c SHA256SUMS
          )
          OTTO_UPDATE_ASSET_BASE_URL="https://github.com/${RELEASES_REPO}/releases/download/${TAG}" \
            node packages/desktop/scripts/verify-update-manifest.mjs \
            release-assets "$VERSION"
          node scripts/release-payload-signature.mjs verify \
            release-assets/UPDATE-MIRROR-SHA256SUMS \
            release-assets/UPDATE-MIRROR-SHA256SUMS.sig
          mkdir mirror-assets
          cp -- \
            release-assets/Otto-${VERSION}-arm64.dmg \
            release-assets/Otto-${VERSION}-arm64.dmg.blockmap \
            release-assets/Otto-${VERSION}-x64.dmg \
            release-assets/Otto-${VERSION}-x64.dmg.blockmap \
            release-assets/Otto-Setup-${VERSION}-win-x64.exe \
            release-assets/Otto-Setup-${VERSION}-win-x64.exe.blockmap \
            mirror-assets/
          mapfile -d '' mirror_manifests < <(
            find release-download -type f -name latest.mirror.json -print0
          )
          if [ "${#mirror_manifests[@]}" -ne 1 ]; then
            echo "Expected exactly one internal mirror manifest, found ${#mirror_manifests[@]}." >&2
            exit 1
          fi
          cp -- "${mirror_manifests[0]}" mirror-assets/latest.json
          OTTO_UPDATE_ASSET_BASE_URL="$UPDATE_MIRROR_ASSET_BASE_URL" \
            node packages/desktop/scripts/verify-update-manifest.mjs \
            mirror-assets "$VERSION"
          node scripts/update-mirror-manifest.mjs verify \
            release-assets/UPDATE-MIRROR-SHA256SUMS mirror-assets \
            "$VERSION" "$PACKAGE_ID" "$SOURCE_COMMIT"
          while IFS= read -r -d '' artifact; do
            GH_TOKEN="$CANONICAL_TOKEN" gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY"
          done < <(find release-assets -maxdepth 1 -type f -print0)
          GH_TOKEN="$CANONICAL_TOKEN" gh attestation verify \
            "${mirror_manifests[0]}" --repo "$GITHUB_REPOSITORY"
          mapfile -d '' notes < <(find release-download -type f -name release-notes.md -print0)
          if [ "${#notes[@]}" -ne 1 ]; then
            echo "Expected exactly one immutable release notes file, found ${#notes[@]}." >&2
            exit 1
          fi
          NOTES_FILE="${notes[0]}"
          EXPECTED_NAME="Otto v${VERSION}"
          mapfile -t expected_assets < <(
            while IFS= read -r -d '' artifact; do
              printf '%s\t%s\tsha256:%s\n' \
                "$(basename "$artifact")" \
                "$(stat -c '%s' "$artifact")" \
                "$(sha256sum "$artifact" | awk '{print $1}')"
            done < <(find release-assets -maxdepth 1 -type f -print0)
          )
          mapfile -t expected_assets < <(
            printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort
          )
          verify_release() {
            local repository="$1"
            local token="$2"
            local expected_target="$3"
            local expected_draft="$4"
            local release_json
            local actual_body_file
            local expected_release_id
            local latest_json
            release_json="$(GH_TOKEN="$token" gh api "repos/${repository}/releases/tags/${TAG}")"
            printf '%s' "$release_json" | jq -e \
              --arg target "$expected_target" \
              --arg name "$EXPECTED_NAME" \
              --argjson draft "$expected_draft" \
              --argjson prerelease "$EXPECTED_PRERELEASE" \
              '.draft == $draft
               and .prerelease == $prerelease
               and .name == $name
               and .target_commitish == $target
               and all(.assets[]; .state == "uploaded" and .size > 0)' >/dev/null
            actual_body_file="$(mktemp)"
            printf '%s' "$release_json" | jq -j '.body // ""' > "$actual_body_file"
            cmp -- "$NOTES_FILE" "$actual_body_file"
            rm -f -- "$actual_body_file"
            mapfile -t actual_assets < <(
              printf '%s' "$release_json" | jq -r \
                '.assets[] | [.name, (.size | tostring), (.digest // "")] | @tsv' | \
                LC_ALL=C sort
            )
            if [ "${#actual_assets[@]}" -ne "${#expected_assets[@]}" ]; then
              echo "Release asset count changed before publication for ${repository}:${TAG}." >&2
              exit 1
            fi
            for index in "${!expected_assets[@]}"; do
              if [ "${actual_assets[$index]}" != "${expected_assets[$index]}" ]; then
                echo "Release asset changed before publication for ${repository}:${TAG}." >&2
                exit 1
              fi
            done
            if [ "$expected_draft" = false ] \
              && [ "$EXPECTED_PRERELEASE" = false ]; then
              expected_release_id="$(printf '%s' "$release_json" | jq -er '.id')"
              for attempt in 1 2 3 4 5 6; do
                if latest_json="$(GH_TOKEN="$token" gh api \
                  "repos/${repository}/releases/latest" 2>/dev/null)" \
                  && printf '%s' "$latest_json" | jq -e \
                    --argjson id "$expected_release_id" --arg tag "$TAG" \
                    '.id == $id and .tag_name == $tag
                     and .draft == false and .prerelease == false' >/dev/null; then
                  return 0
                fi
                [ "$attempt" -lt 6 ] && sleep 5
              done
              echo "Latest Release identity did not converge to ${repository}:${TAG} id=${expected_release_id}." >&2
              exit 1
            fi
          }
          EXTRA_ARGS=(--draft=false)
          if [ "$EXPECTED_PRERELEASE" = "true" ]; then
            EXTRA_ARGS+=(--prerelease)
          else
            EXTRA_ARGS+=(--prerelease=false --latest)
          fi

          node scripts/release-visibility-compensation.mjs \
            verify-pre-public-latest \
            --tag "$TAG" \
            --canonical-repo "$RELEASES_REPO" \
            --legacy-repo "$LEGACY_RELEASES_REPO" \
            --canonical-commit "$SOURCE_COMMIT" \
            --pre-public-latest-snapshot release-state/pre-public-latest.json \
            --pre-public-latest-sha256 "$PRE_PUBLIC_LATEST_SHA256"

          # Canonical is the first public mutation. Its latest.json contains only
          # canonical GitHub asset URLs, so it never exposes a mirror asset that
          # has not yet been published.
          verify_release "$RELEASES_REPO" "$CANONICAL_TOKEN" "$SOURCE_COMMIT" true
          RESOLVED_COMMIT="$(GH_TOKEN="$CANONICAL_TOKEN" gh api \
            "repos/${RELEASES_REPO}/commits/${TAG}" --jq '.sha')"
          if [ "$RESOLVED_COMMIT" != "$SOURCE_COMMIT" ]; then
            echo "Canonical tag changed before publication: tag=$RESOLVED_COMMIT source=$SOURCE_COMMIT" >&2
            exit 1
          fi
          GH_TOKEN="$CANONICAL_TOKEN" gh release edit "$TAG" \
            --repo "$RELEASES_REPO" \
            "${EXTRA_ARGS[@]}"
          verify_release "$RELEASES_REPO" "$CANONICAL_TOKEN" "$SOURCE_COMMIT" false
          RESOLVED_COMMIT="$(GH_TOKEN="$CANONICAL_TOKEN" gh api \
            "repos/${RELEASES_REPO}/commits/${TAG}" --jq '.sha')"
          if [ "$RESOLVED_COMMIT" != "$SOURCE_COMMIT" ]; then
            echo "Canonical release tag changed during publication: tag=$RESOLVED_COMMIT source=$SOURCE_COMMIT" >&2
            exit 1
          fi
          # This check deliberately has no Authorization or Cookie header. It
          # proves that the exact manifest URL consumed by old clients and all
          # six URLs it names (installers plus blockmaps) are anonymously
          # downloadable with the locally attested size and SHA-256.
          node scripts/verify-anonymous-github-release-assets.mjs \
            "$RELEASES_REPO" "$RELEASES_REPO" "$TAG" release-assets

  publish-legacy:
    name: Publish and verify legacy compatibility Release
    needs:
      - build
      - verify-windows-signature
      - create-release-drafts
      - deploy-enterprise
      - validate-deployment-principals
      - publish-canonical
      - deploy-update-mirror
    runs-on: ubuntu-latest
    environment: production-automation
    timeout-minutes: 45
    permissions:
      contents: write
      attestations: read
    if: >-
      ${{
        success()
        && github.run_attempt == 1
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && !inputs.draft)
        )
      }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.source_commit }}

      - name: Setup locked Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify locked Node.js runtime
        shell: bash
        run: test "$(node --version)" = "v${NODE_VERSION}"

      - name: Reconfirm both release endpoints remain compensatable
        shell: bash
        env:
          CANONICAL_ADMIN_TOKEN: ${{ secrets.OTTO_CANONICAL_ADMIN_READ_TOKEN }}
          LEGACY_ADMIN_TOKEN: ${{ secrets.OTTO_LEGACY_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f -- "$RESPONSE_FILE"' EXIT
          require_mutable_releases() {
            local repository="$1"
            local token="$2"
            local status
            test -n "$token"
            status="$(curl --noproxy '*' --proto '=https' --tlsv1.2 \
              --silent --show-error --max-redirs 0 \
              --connect-timeout 15 --max-time 60 --retry 3 --retry-all-errors \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${token}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --output "$RESPONSE_FILE" --write-out '%{http_code}' \
              "https://api.github.com/repos/${repository}/actions/permissions")"
            [ "$status" = 200 ] || {
              echo "Cannot prove Administration:read for ${repository}; HTTP ${status}." >&2
              exit 1
            }
            status="$(curl --noproxy '*' --proto '=https' --tlsv1.2 \
              --silent --show-error --max-redirs 0 \
              --connect-timeout 15 --max-time 60 --retry 3 --retry-all-errors \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${token}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --output "$RESPONSE_FILE" --write-out '%{http_code}' \
              "https://api.github.com/repos/${repository}/immutable-releases")"
            [ "$status" = 404 ] || {
              echo "Cannot prove mutable Releases for ${repository}; HTTP ${status}." >&2
              exit 1
            }
          }
          require_mutable_releases "$RELEASES_REPO" "$CANONICAL_ADMIN_TOKEN"
          require_mutable_releases "$LEGACY_RELEASES_REPO" "$LEGACY_ADMIN_TOKEN"
          node scripts/verify-anonymous-github-release-assets.mjs \
            --repo-public "$RELEASES_REPO"
          node scripts/verify-anonymous-github-release-assets.mjs \
            --repo-public "$LEGACY_RELEASES_REPO"

      - name: Download immutable release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: otto-release-v${{ needs.build.outputs.version }}
          path: release-download

      - name: Download immutable release creation intent
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: otto-release-creation-intent-${{ needs.build.outputs.tag }}
          path: release-state

      - name: Reverify canonical and mirror, then publish legacy last
        shell: bash
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          LEGACY_TOKEN: ${{ secrets.OTTO_LEGACY_RELEASES_TOKEN }}
          EXPECTED_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease && 'true' || 'false' }}
          CREATION_INTENT_SHA256: ${{ needs.create-release-drafts.outputs.creation_intent_sha256 }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          SOURCE_COMMIT="${{ needs.build.outputs.source_commit }}"
          TAG="${{ needs.build.outputs.tag }}"
          test "$(sha256sum release-state/creation-intent.json | awk '{print $1}')" = \
            "$CREATION_INTENT_SHA256"
          LOCKED_LEGACY_COMMIT="$(jq -er \
            '.legacyMainCommit | select(test("^[0-9a-f]{40}$"))' \
            release-state/creation-intent.json)"
          test "$(jq -er '.expected.assetProfile' release-state/creation-intent.json)" = production
          test "$(jq -er '.expected.targets.legacy' release-state/creation-intent.json)" = main
          test "$(jq -er '.expected.tagCommits.legacy' release-state/creation-intent.json)" = \
            "$LOCKED_LEGACY_COMMIT"

          mkdir release-assets mirror-assets remote-mirror-assets
          copy_one() {
            local pattern="$1"
            mapfile -d '' matches < <(find release-download -type f -name "$pattern" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one immutable artifact matching ${pattern}, found ${#matches[@]}." >&2
              exit 1
            fi
            cp -- "${matches[0]}" release-assets/
          }
          copy_one "Otto-${VERSION}-arm64.dmg"
          copy_one "Otto-${VERSION}-arm64.dmg.blockmap"
          copy_one "Otto-${VERSION}-x64.dmg"
          copy_one "Otto-${VERSION}-x64.dmg.blockmap"
          copy_one "Otto-Setup-${VERSION}-win-x64.exe"
          copy_one "Otto-Setup-${VERSION}-win-x64.exe.blockmap"
          copy_one latest.json
          copy_one SHA256SUMS
          copy_one SHA256SUMS.sig
          copy_one UPDATE-MIRROR-SHA256SUMS
          copy_one UPDATE-MIRROR-SHA256SUMS.sig
          copy_one "otto-enterprise-oneclick-v${VERSION}-*.tar.gz"
          copy_one "otto-enterprise-oneclick-v${VERSION}-*.tar.gz.sha256"
          copy_one "otto-enterprise-oneclick-v${VERSION}-*.tar.gz.sig"
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = 14
          (
            cd release-assets
            sha256sum -c SHA256SUMS
          )
          OTTO_UPDATE_ASSET_BASE_URL="https://github.com/${RELEASES_REPO}/releases/download/${TAG}" \
            node packages/desktop/scripts/verify-update-manifest.mjs \
            release-assets "$VERSION"
          cp -- \
            release-assets/Otto-${VERSION}-arm64.dmg \
            release-assets/Otto-${VERSION}-arm64.dmg.blockmap \
            release-assets/Otto-${VERSION}-x64.dmg \
            release-assets/Otto-${VERSION}-x64.dmg.blockmap \
            release-assets/Otto-Setup-${VERSION}-win-x64.exe \
            release-assets/Otto-Setup-${VERSION}-win-x64.exe.blockmap \
            mirror-assets/
          mapfile -d '' mirror_manifests < <(
            find release-download -type f -name latest.mirror.json -print0
          )
          [ "${#mirror_manifests[@]}" -eq 1 ]
          cp -- "${mirror_manifests[0]}" mirror-assets/latest.json
          OTTO_UPDATE_ASSET_BASE_URL="$UPDATE_MIRROR_ASSET_BASE_URL" \
            node packages/desktop/scripts/verify-update-manifest.mjs \
            mirror-assets "$VERSION"

          mapfile -d '' notes < <(find release-download -type f -name release-notes.md -print0)
          [ "${#notes[@]}" -eq 1 ]
          NOTES_FILE="${notes[0]}"
          EXPECTED_NAME="Otto v${VERSION}"
          mapfile -t expected_assets < <(
            while IFS= read -r -d '' artifact; do
              printf '%s\t%s\tsha256:%s\n' \
                "$(basename "$artifact")" \
                "$(stat -c '%s' "$artifact")" \
                "$(sha256sum "$artifact" | awk '{print $1}')"
            done < <(find release-assets -maxdepth 1 -type f -print0)
          )
          mapfile -t expected_assets < <(
            printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort
          )
          verify_release() {
            local repository="$1"
            local token="$2"
            local expected_target="$3"
            local expected_draft="$4"
            local release_json actual_body_file expected_release_id latest_json
            release_json="$(GH_TOKEN="$token" gh api "repos/${repository}/releases/tags/${TAG}")"
            printf '%s' "$release_json" | jq -e \
              --arg target "$expected_target" --arg name "$EXPECTED_NAME" \
              --argjson draft "$expected_draft" \
              --argjson prerelease "$EXPECTED_PRERELEASE" \
              '.draft == $draft and .prerelease == $prerelease
               and .name == $name and .target_commitish == $target
               and all(.assets[]; .state == "uploaded" and .size > 0)' >/dev/null
            actual_body_file="$(mktemp)"
            printf '%s' "$release_json" | jq -j '.body // ""' > "$actual_body_file"
            cmp -- "$NOTES_FILE" "$actual_body_file"
            rm -f -- "$actual_body_file"
            mapfile -t actual_assets < <(
              printf '%s' "$release_json" | jq -r \
                '.assets[] | [.name, (.size | tostring), (.digest // "")] | @tsv' | \
                LC_ALL=C sort
            )
            [ "${#actual_assets[@]}" -eq "${#expected_assets[@]}" ]
            for index in "${!expected_assets[@]}"; do
              [ "${actual_assets[$index]}" = "${expected_assets[$index]}" ] || {
                echo "Release asset identity changed for ${repository}:${TAG}." >&2
                exit 1
              }
            done
            if [ "$expected_draft" = false ] && [ "$EXPECTED_PRERELEASE" = false ]; then
              expected_release_id="$(printf '%s' "$release_json" | jq -er '.id')"
              for attempt in 1 2 3 4 5 6; do
                if latest_json="$(GH_TOKEN="$token" gh api \
                  "repos/${repository}/releases/latest" 2>/dev/null)" \
                  && printf '%s' "$latest_json" | jq -e \
                    --argjson id "$expected_release_id" --arg tag "$TAG" \
                    '.id == $id and .tag_name == $tag
                     and .draft == false and .prerelease == false' >/dev/null; then
                  return 0
                fi
                [ "$attempt" -lt 6 ] && sleep 5
              done
              echo "Latest Release did not converge to ${repository}:${TAG}." >&2
              exit 1
            fi
          }
          verify_public_mirror() {
            curl --noproxy '*' --proto '=https' --tlsv1.2 \
              --fail-with-body --silent --show-error --max-redirs 0 \
              --connect-timeout 15 --max-time 120 --retry 3 --retry-all-errors \
              "${UPDATE_MIRROR_MANIFEST_URL}?legacy_run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --output remote-mirror-assets/latest.json
            cmp mirror-assets/latest.json remote-mirror-assets/latest.json
            for asset in \
              "Otto-${VERSION}-arm64.dmg" \
              "Otto-${VERSION}-arm64.dmg.blockmap" \
              "Otto-${VERSION}-x64.dmg" \
              "Otto-${VERSION}-x64.dmg.blockmap" \
              "Otto-Setup-${VERSION}-win-x64.exe" \
              "Otto-Setup-${VERSION}-win-x64.exe.blockmap"; do
              curl --noproxy '*' --proto '=https' --tlsv1.2 \
                --fail-with-body --silent --show-error --max-redirs 0 \
                --connect-timeout 15 --max-time 900 --retry 3 --retry-all-errors \
                "${UPDATE_MIRROR_ASSET_BASE_URL}/${asset}?legacy_run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                --output "remote-mirror-assets/${asset}"
              expected_sha256="$(sha256sum "mirror-assets/${asset}" | awk '{print $1}')"
              echo "${expected_sha256}  remote-mirror-assets/${asset}" | sha256sum -c -
            done
          }

          # The compatibility endpoint is the final public mutation. Recheck
          # every prerequisite immediately before changing it.
          verify_release "$RELEASES_REPO" "$CANONICAL_TOKEN" "$SOURCE_COMMIT" false
          node scripts/verify-anonymous-github-release-assets.mjs \
            "$RELEASES_REPO" "$RELEASES_REPO" "$TAG" release-assets
          test "$(GH_TOKEN="$CANONICAL_TOKEN" gh api \
            "repos/${RELEASES_REPO}/commits/${TAG}" --jq '.sha')" = "$SOURCE_COMMIT"
          verify_public_mirror
          verify_release "$LEGACY_RELEASES_REPO" "$LEGACY_TOKEN" main true
          test "$(GH_TOKEN="$LEGACY_TOKEN" gh api \
            "repos/${LEGACY_RELEASES_REPO}/commits/${TAG}" --jq '.sha')" = \
            "$LOCKED_LEGACY_COMMIT"

          EXTRA_ARGS=(--draft=false)
          if [ "$EXPECTED_PRERELEASE" = true ]; then
            EXTRA_ARGS+=(--prerelease)
          else
            EXTRA_ARGS+=(--prerelease=false --latest)
          fi
          GH_TOKEN="$LEGACY_TOKEN" gh release edit "$TAG" \
            --repo "$LEGACY_RELEASES_REPO" "${EXTRA_ARGS[@]}"
          verify_release "$LEGACY_RELEASES_REPO" "$LEGACY_TOKEN" main false
          test "$(GH_TOKEN="$LEGACY_TOKEN" gh api \
            "repos/${LEGACY_RELEASES_REPO}/commits/${TAG}" --jq '.sha')" = \
            "$LOCKED_LEGACY_COMMIT"
          node scripts/verify-anonymous-github-release-assets.mjs \
            "$LEGACY_RELEASES_REPO" "$RELEASES_REPO" "$TAG" release-assets
          verify_release "$RELEASES_REPO" "$CANONICAL_TOKEN" "$SOURCE_COMMIT" false
          verify_public_mirror

  finalize-enterprise-release-transaction:
    name: Finalize enterprise deployment after complete release publication
    needs:
      - build
      - deploy-enterprise
      - publish-canonical
      - deploy-update-mirror
      - publish-legacy
    if: >-
      ${{
        success()
        && github.run_attempt == 1
        && needs.deploy-enterprise.outputs.committed == 'true'
      }}
    runs-on: ubuntu-latest
    environment: production-automation
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Durably finalize the exact enterprise deployment
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
          [[ "$DEPLOY_HOST" != *'..'* ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [ "$DEPLOY_PORT" -ge 1 ] && [ "$DEPLOY_PORT" -le 65535 ]
          install -d -m 0700 ~/.ssh
          trap 'rm -f -- ~/.ssh/id_deploy ~/.ssh/known_hosts' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 0600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          TRANSACTION_ID='${{ needs.deploy-enterprise.outputs.transaction_id }}'
          VERSION='${{ needs.build.outputs.version }}'
          [[ "$TRANSACTION_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-[0-9]+$ ]]
          EXPECTED="finalized deployed transaction=${TRANSACTION_ID} version=${VERSION} package=${{ needs.build.outputs.package_identity }} source=${{ needs.build.outputs.source_commit }} previous_version=${{ needs.deploy-enterprise.outputs.previous_version }} previous_package=${{ needs.deploy-enterprise.outputs.previous_package }} previous_source=${{ needs.deploy-enterprise.outputs.previous_source }}"
          OUTPUT=''
          for attempt in 1 2 3 4 5 6; do
            STATUS=0
            if OUTPUT="$(ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" -- \
              /usr/bin/sudo -n -- /usr/local/sbin/otto-enterprise-ci-deploy \
              finalize-deployment "$TRANSACTION_ID" "$VERSION" \
              "${{ needs.build.outputs.package_identity }}" \
              "${{ needs.build.outputs.source_commit }}")"; then
              STATUS=0
            else
              STATUS=$?
            fi
            if [ "$OUTPUT" = "$EXPECTED" ]; then
              break
            fi
            [ "$STATUS" -eq 255 ] && [ "$attempt" -lt 6 ] || {
              echo "Enterprise finalization failed without its exact receipt; status=${STATUS}." >&2
              exit 1
            }
            sleep 2
          done
          [ "$OUTPUT" = "$EXPECTED" ]
          printf '%s\n' "$OUTPUT"

  rollback-update-mirror:
    name: Roll back Desktop Update Mirror
    needs:
      - build
      - deploy-update-mirror
      - publish-canonical
      - publish-legacy
    runs-on: ubuntu-latest
    environment: production-automation
    timeout-minutes: 45
    permissions:
      contents: read
    if: >-
      ${{
        always()
        && github.run_attempt == 1
        && needs.publish-canonical.result == 'success'
        && (
          needs.deploy-update-mirror.result == 'failure'
          || needs.deploy-update-mirror.result == 'cancelled'
          || needs.deploy-update-mirror.result == 'skipped'
          || (
            needs.deploy-update-mirror.result == 'success'
            && (
              needs.publish-legacy.result == 'failure'
              || needs.publish-legacy.result == 'cancelled'
              || needs.publish-legacy.result == 'skipped'
            )
          )
        )
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && !inputs.draft)
        )
      }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ROLLBACK_DEPLOY_USER: ${{ secrets.ROLLBACK_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          ROLLBACK_DEPLOY_SSH_KEY: ${{ secrets.ROLLBACK_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
          [[ "$DEPLOY_HOST" != *'..'* ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ "$ROLLBACK_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [ "$DEPLOY_USER" != "$ROLLBACK_DEPLOY_USER" ]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [ "$DEPLOY_PORT" -ge 1 ] && [ "$DEPLOY_PORT" -le 65535 ]
          test -n "$ROLLBACK_DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Configure hardened SSH identity
        shell: bash
        env:
          ROLLBACK_DEPLOY_SSH_KEY: ${{ secrets.ROLLBACK_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$ROLLBACK_DEPLOY_SSH_KEY" > ~/.ssh/id_rollback
          chmod 0600 ~/.ssh/id_rollback
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Restore previous mirror manifest
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ROLLBACK_DEPLOY_USER: ${{ secrets.ROLLBACK_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY: ${{ secrets.OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          MIRROR_TRANSACTION_ID="${{ needs.build.outputs.tag }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$MIRROR_TRANSACTION_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-[0-9]+$ ]]
          SSH_OPTIONS=(
            -i ~/.ssh/id_rollback
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )
          EXPECTED_KEY_ID="$(printf '%s\n' "$OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY" | \
            openssl pkey -pubin -outform DER | sha256sum | awk '{print substr($1,1,16)}')"
          EXPECTED_PREFLIGHT="protocol=otto-enterprise-ci-deploy-v5 gateway=$(sha256sum deployment/enterprise-oneclick/ci-deploy-gateway.sh | awk '{print $1}') publish=$(sha256sum deployment/enterprise-oneclick/ci/publish-update-mirror.sh | awk '{print $1}') rollback=$(sha256sum deployment/enterprise-oneclick/ci/rollback-update-mirror.sh | awk '{print $1}') key=${EXPECTED_KEY_ID} config=/etc/otto-enterprise/enterprise.env deploy_user=${DEPLOY_USER} rollback_user=${ROLLBACK_DEPLOY_USER}"
          ACTUAL_PREFLIGHT="$(ssh "${SSH_OPTIONS[@]}" "${ROLLBACK_DEPLOY_USER}@${DEPLOY_HOST}" -- \
            /usr/bin/sudo -n -- /usr/local/sbin/otto-enterprise-ci-deploy \
            preflight)"
          if [ "$ACTUAL_PREFLIGHT" != "$EXPECTED_PREFLIGHT" ]; then
            echo 'Installed root gateway, helpers, or signing trust anchor changed before rollback.' >&2
            printf 'expected: %s\nactual:   %s\n' "$EXPECTED_PREFLIGHT" "$ACTUAL_PREFLIGHT" >&2
            exit 1
          fi
          RESTORED_SHA256=''
          for rollback_attempt in 1 2 3 4 5 6; do
            ROLLBACK_OUTPUT=''
            ROLLBACK_STATUS=0
            if ROLLBACK_OUTPUT="$(ssh "${SSH_OPTIONS[@]}" \
              "${ROLLBACK_DEPLOY_USER}@${DEPLOY_HOST}" -- \
              /usr/bin/sudo -n -- /usr/local/sbin/otto-enterprise-ci-deploy \
              rollback-mirror "$MIRROR_TRANSACTION_ID")"; then
              ROLLBACK_STATUS=0
            else
              ROLLBACK_STATUS=$?
            fi
            printf '%s\n' "$ROLLBACK_OUTPUT"
            mapfile -t RESTORED_LINES < <(
              printf '%s\n' "$ROLLBACK_OUTPUT" | \
                grep -E '^restored_manifest_sha256=([0-9a-f]{64}|absent)$' || true
            )
            if [ "${#RESTORED_LINES[@]}" -eq 1 ]; then
              RESTORED_SHA256="${RESTORED_LINES[0]#restored_manifest_sha256=}"
              break
            fi
            if [ "${#RESTORED_LINES[@]}" -gt 1 ]; then
              echo 'Rollback gateway returned multiple restored manifest identities.' >&2
              exit 1
            fi
            if [ "$ROLLBACK_STATUS" -ne 255 ]; then
              echo "Rollback gateway failed without an exact receipt; ssh status=${ROLLBACK_STATUS}." >&2
              exit 1
            fi
            echo "Rollback receipt was lost in transport on attempt ${rollback_attempt}; retrying the idempotent transaction." >&2
            if [ "$rollback_attempt" -lt 6 ]; then
              sleep 2
            fi
          done
          if [ -z "$RESTORED_SHA256" ]; then
            echo 'Rollback gateway did not return one exact restored manifest identity after retries.' >&2
            exit 1
          fi
          REMOTE_MANIFEST="$(mktemp)"
          trap 'rm -f -- "$REMOTE_MANIFEST"' EXIT
          PUBLIC_RESTORED='false'
          for retry in 1 2 3 4 5 6; do
            HTTP_STATUS=''
            if HTTP_STATUS="$(curl --noproxy '*' --proto '=https' --tlsv1.2 \
              --silent --show-error --max-redirs 0 \
              --connect-timeout 15 --max-time 30 --retry 2 --retry-all-errors \
              --output "$REMOTE_MANIFEST" --write-out '%{http_code}' \
              "${UPDATE_MIRROR_MANIFEST_URL}?rollback_run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${retry}")"; then
              if [ "$RESTORED_SHA256" = 'absent' ] \
                && [ "$HTTP_STATUS" = '404' ]; then
                PUBLIC_RESTORED='true'
                break
              elif [ "$RESTORED_SHA256" != 'absent' ] \
                && [ "$HTTP_STATUS" = '200' ] \
                && [ "$(sha256sum "$REMOTE_MANIFEST" | awk '{print $1}')" = "$RESTORED_SHA256" ]; then
                PUBLIC_RESTORED='true'
                break
              fi
            else
              echo "Public mirror verification transport failed on attempt ${retry}; retrying." >&2
            fi
            if [ "$retry" -lt 6 ]; then
              sleep 2
            fi
          done
          if [ "$PUBLIC_RESTORED" != 'true' ]; then
            echo 'Public update mirror did not converge to the exact restored manifest; keeping Releases public.' >&2
            exit 1
          fi

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f -- ~/.ssh/id_rollback ~/.ssh/known_hosts

  rollback-release-publication:
    name: Restore previous latest pointers without retracting Releases
    needs:
      - build
      - create-release-drafts
      - deploy-enterprise
      - publish-canonical
      - deploy-update-mirror
      - publish-legacy
      - rollback-update-mirror
    runs-on: ubuntu-latest
    environment: production-automation
    timeout-minutes: 40
    permissions:
      contents: write
    if: >-
      ${{
        always()
        && github.run_attempt == 1
        && needs.create-release-drafts.result == 'success'
        && (
          needs.publish-canonical.result == 'failure'
          || needs.publish-canonical.result == 'cancelled'
          || (
            needs.publish-canonical.result == 'skipped'
            && (
              needs.deploy-enterprise.result == 'failure'
              || needs.deploy-enterprise.result == 'cancelled'
              || needs.deploy-enterprise.result == 'success'
            )
          )
          || (
            needs.publish-canonical.result == 'success'
            && needs.rollback-update-mirror.result == 'success'
            && (
              needs.deploy-update-mirror.result == 'failure'
              || needs.deploy-update-mirror.result == 'cancelled'
              || needs.deploy-update-mirror.result == 'skipped'
              || needs.publish-legacy.result == 'failure'
              || needs.publish-legacy.result == 'cancelled'
              || needs.publish-legacy.result == 'skipped'
            )
          )
        )
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && !inputs.draft)
        )
      }}
    steps:
      - name: Reconfirm mutable release settings before compensation
        shell: bash
        env:
          CANONICAL_ADMIN_TOKEN: ${{ secrets.OTTO_CANONICAL_ADMIN_READ_TOKEN }}
          LEGACY_ADMIN_TOKEN: ${{ secrets.OTTO_LEGACY_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f -- "$RESPONSE_FILE"' EXIT
          request_status() {
            local repository="$1"
            local token="$2"
            local endpoint="$3"
            curl --noproxy '*' --proto '=https' --tlsv1.2 \
              --silent --show-error --max-redirs 0 \
              --connect-timeout 15 --max-time 60 \
              --retry 3 --retry-all-errors --retry-max-time 90 \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${token}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --output "$RESPONSE_FILE" \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${repository}${endpoint}"
          }
          require_mutable_releases() {
            local repository="$1"
            local token="$2"
            local status
            test -n "$token"
            status="$(request_status "$repository" "$token" '/actions/permissions')"
            if [ "$status" != '200' ]; then
              echo "Compensation token cannot prove Administration:read for ${repository}; HTTP ${status}. Both Releases remain public." >&2
              exit 1
            fi
            status="$(request_status "$repository" "$token" '/immutable-releases')"
            case "$status" in
              404) ;;
              200)
                echo "Immutable releases are enabled for ${repository}; refusing a partial compensation. Both Releases remain public." >&2
                exit 1
                ;;
              *)
                echo "Could not prove immutable releases are disabled for ${repository}; HTTP ${status}. Both Releases remain public." >&2
                exit 1
                ;;
            esac
          }
          # Prove both endpoints are mutable before changing either endpoint.
          require_mutable_releases "$RELEASES_REPO" "$CANONICAL_ADMIN_TOKEN"
          require_mutable_releases "$LEGACY_RELEASES_REPO" "$LEGACY_ADMIN_TOKEN"

      - name: Checkout locked release visibility compensation helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          persist-credentials: false

      - name: Setup locked Node.js runtime for compensation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify locked compensation runtime
        shell: bash
        run: test "$(node --version)" = "v${NODE_VERSION}"

      - name: Download immutable release artifact for compensation identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: otto-release-v${{ needs.build.outputs.version }}
          path: release-download

      - name: Download immutable release creation intent
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: otto-release-creation-intent-${{ needs.build.outputs.tag }}
          path: release-state

      - name: Transactionally restore exact previous latest pointers
        shell: bash
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          LEGACY_TOKEN: ${{ secrets.OTTO_LEGACY_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release-visibility-compensation.mjs \
            compensate \
            --tag "${{ needs.build.outputs.tag }}" \
            --canonical-repo "$RELEASES_REPO" \
            --legacy-repo "$LEGACY_RELEASES_REPO" \
            --canonical-commit "${{ needs.build.outputs.source_commit }}" \
            --canonical-target "${{ needs.build.outputs.source_commit }}" \
            --legacy-target main \
            --artifact-dir release-download \
            --package-identity "${{ needs.build.outputs.package_identity }}" \
            --expected-prerelease "${{ github.event_name == 'workflow_dispatch' && inputs.prerelease && 'true' || 'false' }}" \
            --pre-public-latest-snapshot release-state/pre-public-latest.json \
            --pre-public-latest-sha256 "${{ needs.create-release-drafts.outputs.pre_public_latest_sha256 }}"

  rollback-enterprise-release-transaction:
    name: Roll back enterprise deployment after incomplete release publication
    needs:
      - build
      - deploy-enterprise
      - publish-canonical
      - deploy-update-mirror
      - publish-legacy
      - rollback-update-mirror
      - rollback-release-publication
    if: >-
      ${{
        always()
        && github.run_attempt == 1
        && needs.deploy-enterprise.result == 'success'
        && needs.deploy-enterprise.outputs.committed == 'true'
        && (
          needs.publish-canonical.result != 'success'
          || needs.deploy-update-mirror.result != 'success'
          || needs.publish-legacy.result != 'success'
        )
        && needs.rollback-release-publication.result == 'success'
        && (
          needs.publish-canonical.result != 'success'
          || needs.rollback-update-mirror.result == 'success'
        )
      }}
    runs-on: ubuntu-latest
    environment: production-automation
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Durably restore the exact previous enterprise deployment
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          ROLLBACK_DEPLOY_USER: ${{ secrets.ROLLBACK_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          ROLLBACK_DEPLOY_SSH_KEY: ${{ secrets.ROLLBACK_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
          [[ "$DEPLOY_HOST" != *'..'* ]]
          [[ "$ROLLBACK_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [ "$DEPLOY_PORT" -ge 1 ] && [ "$DEPLOY_PORT" -le 65535 ]
          install -d -m 0700 ~/.ssh
          trap 'rm -f -- ~/.ssh/id_rollback ~/.ssh/known_hosts restored-health.json' EXIT
          printf '%s\n' "$ROLLBACK_DEPLOY_SSH_KEY" > ~/.ssh/id_rollback
          chmod 0600 ~/.ssh/id_rollback
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          TRANSACTION_ID='${{ needs.deploy-enterprise.outputs.transaction_id }}'
          VERSION='${{ needs.build.outputs.version }}'
          [[ "$TRANSACTION_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-[0-9]+$ ]]
          EXPECTED="rolled_back transaction=${TRANSACTION_ID} restored_version=${{ needs.deploy-enterprise.outputs.previous_version }} restored_package=${{ needs.deploy-enterprise.outputs.previous_package }} restored_source=${{ needs.deploy-enterprise.outputs.previous_source }} replaced_version=${VERSION} replaced_package=${{ needs.build.outputs.package_identity }} replaced_source=${{ needs.build.outputs.source_commit }}"
          OUTPUT=''
          for attempt in 1 2 3 4 5 6; do
            STATUS=0
            if OUTPUT="$(ssh -i ~/.ssh/id_rollback -p "$DEPLOY_PORT" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              "${ROLLBACK_DEPLOY_USER}@${DEPLOY_HOST}" -- \
              /usr/bin/sudo -n -- /usr/local/sbin/otto-enterprise-ci-deploy \
              rollback-enterprise "$TRANSACTION_ID" "$VERSION" \
              "${{ needs.build.outputs.package_identity }}" \
              "${{ needs.build.outputs.source_commit }}")"; then
              STATUS=0
            else
              STATUS=$?
            fi
            if [ "$OUTPUT" = "$EXPECTED" ]; then
              break
            fi
            [ "$STATUS" -eq 255 ] && [ "$attempt" -lt 6 ] || {
              echo "Enterprise rollback failed without its exact receipt; status=${STATUS}." >&2
              exit 1
            }
            sleep 2
          done
          [ "$OUTPUT" = "$EXPECTED" ]
          printf '%s\n' "$OUTPUT"

      - name: Verify restored public enterprise identity
        shell: bash
        env:
          ENTERPRISE_PUBLIC_URL: ${{ secrets.OTTO_ENTERPRISE_PUBLIC_URL }}
        run: |
          set -euo pipefail
          PUBLIC_ORIGIN="$(ENTERPRISE_PUBLIC_URL="$ENTERPRISE_PUBLIC_URL" node --input-type=module -e '
            const url = new URL(process.env.ENTERPRISE_PUBLIC_URL);
            if (url.protocol !== "https:" || url.username || url.password ||
                (url.pathname !== "/" && url.pathname !== "") || url.search || url.hash) process.exit(2);
            process.stdout.write(url.origin);
          ')"
          curl --noproxy '*' --proto '=https' --tlsv1.2 \
            --fail-with-body --silent --show-error --max-redirs 0 \
            --connect-timeout 15 --max-time 120 --retry 5 --retry-all-errors \
            "${PUBLIC_ORIGIN}/enterprise/health?release_rollback=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output restored-health.json
          jq -e --arg version '${{ needs.deploy-enterprise.outputs.previous_version }}' \
            '.status == "ok" and .service == "otto-enterprise"
             and .version == $version and .appVersion == $version' \
            restored-health.json >/dev/null
