name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release. Empty means package.json version.'
        required: false
        type: string
      draft:
        description: 'Create or update a draft release.'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark release as prerelease.'
        required: false
        type: boolean
        default: false
      unsigned_mac_transition:
        description: 'Build unsigned macOS transition artifacts when Apple signing is unavailable.'
        required: false
        type: boolean
        default: false
      release_channel:
        description: 'Enterprise package release channel.'
        required: false
        type: choice
        options:
          - stable
          - transition
        default: stable
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.1'
  ELECTRON_VERSION: '43.2.0'
  SQLCIPHER_SOURCE_REVISION: e2a6040f2ae5cfff2b3e08eb3320007d93cdf3fc
  RELEASES_REPO: NSIETeam/otto-new
  LEGACY_RELEASES_REPO: Felix201209/otto-releases
  UPDATE_MIRROR_ASSET_BASE_URL: 'https://59.110.154.44:7777/downloads'
  UPDATE_MIRROR_MANIFEST_URL: 'https://59.110.154.44:7777/otto-releases/latest.json'
  UPDATE_MIRROR_ROOT: '/opt/otto-website'

jobs:
  sqlcipher-native:
    name: Build verified SQLCipher native matrix
    uses: ./.github/workflows/sqlcipher-native.yml

  build:
    name: Check, Build, Draft Release
    runs-on: macos-latest
    timeout-minutes: 90
    needs: sqlcipher-native
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_commit: ${{ steps.source.outputs.commit }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci
        env:
          PYTHON: python3.11
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce release dependency audit
        run: npm run security:dependencies:release

      - name: Verify hostile-server defenses and E2EE release authorization
        run: |
          npm run security:e2ee:adversarial
          npm run security:e2ee:release:verify
          npm run security:e2ee:policy:check

      - name: Preserve E2EE adversarial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2ee-adversarial-release-evidence
          path: artifacts/security/e2ee-adversarial-report.json
          if-no-files-found: error

      - name: Download verified SQLCipher native matrix
        uses: actions/download-artifact@v7
        with:
          name: sqlcipher-native-matrix
          path: native/sqlcipher

      - name: Verify SQLCipher native matrix before packaging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-sqlcipher-native-assets.mjs \
            --expected-build-commit "$GITHUB_SHA" \
            --expected-source-revision "$SQLCIPHER_SOURCE_REVISION" \
            --expected-runtime-version "$ELECTRON_VERSION" \
            --require-matrix-manifest
          while IFS= read -r -d '' binding; do
            gh attestation verify "$binding" --repo "$GITHUB_REPOSITORY"
          done < <(find native/sqlcipher -type f -name better_sqlite3.node -print0)
          gh attestation verify native/sqlcipher/matrix-manifest.json \
            --repo "$GITHUB_REPOSITORY"

      - name: Download verified enterprise Node.js SQLCipher native matrix
        uses: actions/download-artifact@v7
        with:
          name: sqlcipher-node-native-matrix
          path: native/sqlcipher-node

      - name: Verify enterprise Node.js SQLCipher matrix before packaging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-sqlcipher-native-assets.mjs \
            --root native/sqlcipher-node \
            --runtime node \
            --expected-build-commit "$GITHUB_SHA" \
            --expected-source-revision "$SQLCIPHER_SOURCE_REVISION" \
            --expected-runtime-version "$NODE_VERSION" \
            --require-matrix-manifest
          while IFS= read -r -d '' binding; do
            gh attestation verify "$binding" --repo "$GITHUB_REPOSITORY"
          done < <(find native/sqlcipher-node -type f -name better_sqlite3.node -print0)
          gh attestation verify native/sqlcipher-node/matrix-manifest.json \
            --repo "$GITHUB_REPOSITORY"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          DESKTOP_VERSION="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$VERSION" != "$ROOT_VERSION" ] || [ "$VERSION" != "$DESKTOP_VERSION" ]; then
            echo "Version mismatch: target=$VERSION root=$ROOT_VERSION desktop=$DESKTOP_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require a release source based on the latest internal commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin internal
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          INTERNAL_COMMIT="$(git rev-parse origin/internal)"
          if ! git merge-base --is-ancestor "$INTERNAL_COMMIT" "$SOURCE_COMMIT"; then
            echo "Release source must contain the latest origin/internal commit." >&2
            echo "source=$SOURCE_COMMIT internal=$INTERNAL_COMMIT" >&2
            exit 1
          fi
          if [ "$SOURCE_COMMIT" != "$INTERNAL_COMMIT" ] \
            && [[ "$GITHUB_REF" != refs/heads/release/* ]] \
            && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Commits beyond origin/internal may only be released from release/* branches or version tags." >&2
            echo "ref=$GITHUB_REF source=$SOURCE_COMMIT internal=$INTERNAL_COMMIT" >&2
            exit 1
          fi
          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Validate enterprise license trust anchor
        if: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) }}
        shell: bash
        env:
          LICENSE_PUBLIC_KEYS: ${{ secrets.OTTO_LICENSE_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          test -n "$LICENSE_PUBLIC_KEYS"

      - name: Require desktop signing and notarization custody
        if: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) }}
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ENTERPRISE_SIGNING_PRIVATE_KEY: ${{ secrets.OTTO_ENTERPRISE_SIGNING_PRIVATE_KEY }}
          ENTERPRISE_SIGNING_PUBLIC_KEY: ${{ secrets.OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY }}
          LEGACY_RELEASES_TOKEN: ${{ secrets.OTTO_LEGACY_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MAC_CSC_LINK"
          test -n "$MAC_CSC_KEY_PASSWORD"
          test -n "$WIN_CSC_LINK"
          test -n "$WIN_CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$ENTERPRISE_SIGNING_PRIVATE_KEY"
          test -n "$ENTERPRISE_SIGNING_PUBLIC_KEY"
          test -n "$LEGACY_RELEASES_TOKEN"

      - name: Repository anomaly checks
        run: |
          npm run doctor
          git diff --check
          npm run validate:integration-baseline
          npm run validate:boundaries
          npm run size:source:check

      - name: Release quality gates
        run: |
          npm run lint:ci
          npm run build
          npm run typecheck
          npm run test:ci
          npm run test:scripts -- --run \
            scripts/tests/enterprise-runtime-dependencies.test.js

      - name: Focused regression tests
        run: |
          npx vitest run \
            packages/core/src/config/lazy-heavy-tools.registration.test.ts \
            packages/core/src/core/customModelAdapter.test.ts \
            packages/desktop/src/main/enterprise-client.test.ts \
            packages/desktop/scripts/packaging-contract.test.mjs \
            packages/desktop/src/main/video-editor-resource.test.ts \
            packages/desktop/scripts/make-latest-json.test.mjs \
            packages/desktop/scripts/update-mirror-config.test.mjs \
            packages/server/src/enterprise/db.test.ts \
            packages/server/src/enterprise/parkEndpoints.test.ts \
            packages/server/src/server.test.ts \
            packages/server/src/enterprise/server.test.ts

      - name: Verify V1.9.13 to V1.9.14 upgrade acceptance
        run: npm run release:upgrade:verify

      - name: Build desktop release artifacts
        run: node scripts/make-delivery-zip.mjs --build
        working-directory: packages/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTTO_RELEASES_REPO: ${{ env.RELEASES_REPO }}
          OTTO_UPDATE_ASSET_BASE_URL: ${{ env.UPDATE_MIRROR_ASSET_BASE_URL }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OTTO_ALLOW_UNSIGNED_MAC: ${{ inputs.unsigned_mac_transition && '1' || '0' }}

      - name: Enforce packaged content and installer size budget
        run: npm run release:gate --workspace=packages/desktop
        env:
          OTTO_DESKTOP_BASELINE_INSTALLER_BYTES: '128032671'
          OTTO_DESKTOP_MAX_INSTALLER_GROWTH_MB: '8'
          OTTO_DESKTOP_MAX_INSTALLER_MB: '140'

      - name: Verify signed macOS disk images
        if: ${{ inputs.unsigned_mac_transition != true }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          for dmg in \
            "packages/desktop/release/Otto-${VERSION}-arm64.dmg" \
            "packages/desktop/release/Otto-${VERSION}-x64.dmg"; do
            codesign --verify --verbose=2 "$dmg"
            spctl --assess --type open --context context:primary-signature \
              --verbose=4 "$dmg"
          done

      - name: Build enterprise server package
        if: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) }}
        run: npm run bundle:enterprise
        env:
          OTTO_LICENSE_PUBLIC_KEYS: ${{ secrets.OTTO_LICENSE_PUBLIC_KEYS }}
          OTTO_ENTERPRISE_SIGNING_PRIVATE_KEY: ${{ secrets.OTTO_ENTERPRISE_SIGNING_PRIVATE_KEY }}
          OTTO_RELEASE_CHANNEL: ${{ inputs.release_channel || 'stable' }}

      - name: Verify release artifacts
        id: artifacts
        shell: bash
        env:
          OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY: ${{ secrets.OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY }}
          DESKTOP_TEST_BUILD: ${{ inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true && '1' || '0' }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DESKTOP_RELEASE="packages/desktop/release"
          test -f "$DESKTOP_RELEASE/Otto-${VERSION}-arm64.dmg"
          test -f "$DESKTOP_RELEASE/Otto-${VERSION}-x64.dmg"
          test -f "$DESKTOP_RELEASE/Otto-Setup-${VERSION}-win-x64.exe"
          test -f "$DESKTOP_RELEASE/latest.json"
          node packages/desktop/scripts/verify-update-manifest.mjs "$DESKTOP_RELEASE" "$VERSION"
          FILES=(
            "$DESKTOP_RELEASE/Otto-${VERSION}-arm64.dmg"
            "$DESKTOP_RELEASE/Otto-${VERSION}-arm64.dmg.blockmap"
            "$DESKTOP_RELEASE/Otto-${VERSION}-x64.dmg"
            "$DESKTOP_RELEASE/Otto-${VERSION}-x64.dmg.blockmap"
            "$DESKTOP_RELEASE/Otto-Setup-${VERSION}-win-x64.exe"
            "$DESKTOP_RELEASE/Otto-Setup-${VERSION}-win-x64.exe.blockmap"
            "$DESKTOP_RELEASE/latest.json"
          )
          if [ "$DESKTOP_TEST_BUILD" != "1" ]; then
            ENTERPRISE_ARCHIVE="$(ls deliverables/otto-enterprise-oneclick-v${VERSION}-*.tar.gz | head -n 1)"
            ENTERPRISE_SHA="${ENTERPRISE_ARCHIVE}.sha256"
            ENTERPRISE_SIGNATURE="${ENTERPRISE_ARCHIVE}.sig"
            test -f "$ENTERPRISE_ARCHIVE"
            test -f "$ENTERPRISE_SHA"
            test -f "$ENTERPRISE_SIGNATURE"
            sha256sum -c "$ENTERPRISE_SHA"
            node scripts/verify-enterprise-package-signature.mjs \
              "$ENTERPRISE_ARCHIVE" "$ENTERPRISE_SIGNATURE"
            FILES+=("$ENTERPRISE_ARCHIVE" "$ENTERPRISE_SHA" "$ENTERPRISE_SIGNATURE")
          fi
          {
            echo "files<<EOF"
            printf '%s\n' "${FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes with no-proxy download
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          INSTALLER="packages/desktop/release/Otto-Setup-${VERSION}-win-x64.exe"
          INSTALLER_SHA="$(shasum -a 256 "$INSTALLER" | awk '{print $1}')"
          NOTES_FILE="$RUNNER_TEMP/otto-v${VERSION}-release-notes.md"
          {
            echo "## Otto v${VERSION}"
            echo
            echo "Source commit: \`${{ steps.source.outputs.commit }}\`"
            echo
            echo "### Windows no-proxy download"
            echo
            echo "[Download Windows x64 installer from the Otto mirror](${UPDATE_MIRROR_ASSET_BASE_URL}/Otto-Setup-${VERSION}-win-x64.exe)"
            echo
            echo "SHA256: \`${INSTALLER_SHA}\`"
            echo
            echo "Windows Authenticode and macOS Developer ID/notarization are mandatory release gates."
            echo "The release workflow also verifies SHA-256 checksums, SQLCipher provenance and SBOMs, the desktop update manifest, the enterprise Ed25519 package signature, and the License public-key trust anchor."
            echo
            echo "Desktop installers, update manifest, and enterprise one-click package are attached to this release."
          } > "$NOTES_FILE"
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otto-release-v${{ steps.version.outputs.version }}
          path: |
            packages/desktop/release/*
            deliverables/otto-enterprise-oneclick-v${{ steps.version.outputs.version }}-*.tar.gz
            deliverables/otto-enterprise-oneclick-v${{ steps.version.outputs.version }}-*.tar.gz.sha256
            deliverables/otto-enterprise-oneclick-v${{ steps.version.outputs.version }}-*.tar.gz.sig
          retention-days: 30

      - name: Create draft GitHub release
        if: github.repository == 'NSIETeam/otto-new'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ github.token }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.source.outputs.commit }}
          name: Otto v${{ steps.version.outputs.version }}
          draft: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          files: ${{ steps.artifacts.outputs.files }}
          body_path: ${{ steps.release_notes.outputs.path }}

      - name: Create legacy compatibility draft release
        if: ${{ github.repository == 'NSIETeam/otto-new' && !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.LEGACY_RELEASES_REPO }}
          token: ${{ secrets.OTTO_LEGACY_RELEASES_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          # This public repository intentionally contains assets only. Bind its
          # compatibility tag explicitly instead of leaking the private source
          # object graph; the release body records the locked canonical RC SHA.
          target_commitish: main
          name: Otto v${{ steps.version.outputs.version }}
          draft: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          files: ${{ steps.artifacts.outputs.files }}
          body_path: ${{ steps.release_notes.outputs.path }}

  verify-windows-signature:
    name: Verify Windows Authenticode and packaged runtime
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    if: ${{ !(inputs.unsigned_mac_transition == true && inputs.release_channel == 'transition' && inputs.draft == true && inputs.prerelease == true) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked JavaScript runtime
        run: npm ci --ignore-scripts

      - name: Download release workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-release-v${{ needs.build.outputs.version }}
          path: release-download

      - name: Require a valid Authenticode chain
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release-download -Recurse `
            -Filter 'Otto-Setup-${{ needs.build.outputs.version }}-win-x64.exe' |
            Select-Object -First 1
          if (-not $installer) { throw 'Windows installer is missing' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) {
            throw "Windows Authenticode verification failed: $($signature.Status) $($signature.StatusMessage)"
          }
          Write-Host "Authenticode signer: $($signature.SignerCertificate.Subject)"

      - name: Install and load the packaged SQLCipher binding
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release-download -Recurse `
            -Filter 'Otto-Setup-${{ needs.build.outputs.version }}-win-x64.exe' |
            Select-Object -First 1
          if (-not $installer) { throw 'Windows installer is missing' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'otto-packaged-runtime'
          $process = Start-Process -FilePath $installer.FullName -Wait -PassThru `
            -ArgumentList @('/S', "/D=$installRoot")
          if ($process.ExitCode -ne 0) {
            throw "Silent installer failed: $($process.ExitCode)"
          }
          $electron = Join-Path $installRoot 'Otto.exe'
          $binding = Join-Path $installRoot 'resources\sqlcipher\better_sqlite3.node'
          if (-not (Test-Path -LiteralPath $electron)) { throw 'Installed Otto.exe is missing' }
          if (-not (Test-Path -LiteralPath $binding)) { throw 'Installed SQLCipher binding is missing' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          & $electron packages/desktop/scripts/probe-packaged-sqlcipher.mjs `
            --binding $binding
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged SQLCipher runtime probe failed: $LASTEXITCODE"
          }

  deploy-enterprise:
    name: Deploy Enterprise Server
    needs:
      - build
      - verify-windows-signature
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      ${{
        success()
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && !inputs.draft)
        )
      }}
    env:
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_CONFIG_PATH: ${{ secrets.DEPLOY_CONFIG_PATH || '/etc/otto-enterprise/enterprise.env' }}
      DEPLOY_SUDO_PASSWORD: ${{ secrets.DEPLOY_SUDO_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}"
          test -n "${{ secrets.DEPLOY_USER }}"
          test -n "${{ secrets.DEPLOY_SSH_KEY }}"
          test -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}"
          test -n "$DEPLOY_SUDO_PASSWORD"

      - name: Download release workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-release-v${{ needs.build.outputs.version }}
          path: release-download

      - name: Verify enterprise package
        shell: bash
        env:
          OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY: ${{ secrets.OTTO_ENTERPRISE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p enterprise-upload
          ARCHIVE="$(find release-download -type f -name 'otto-enterprise-oneclick-v${{ needs.build.outputs.version }}-*.tar.gz' -print -quit)"
          CHECKSUM="$(find release-download -type f -name 'otto-enterprise-oneclick-v${{ needs.build.outputs.version }}-*.tar.gz.sha256' -print -quit)"
          SIGNATURE="$(find release-download -type f -name 'otto-enterprise-oneclick-v${{ needs.build.outputs.version }}-*.tar.gz.sig' -print -quit)"
          test -n "$ARCHIVE"
          test -n "$CHECKSUM"
          test -n "$SIGNATURE"
          cp "$ARCHIVE" "$CHECKSUM" "$SIGNATURE" enterprise-upload/
          cd enterprise-upload
          sha256sum -c ./*.sha256
          node ../scripts/verify-enterprise-package-signature.mjs \
            "$(basename "$ARCHIVE")" "$(basename "$SIGNATURE")"
          ls -lh ./*

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload enterprise package
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_TRANSACTION_ID="${{ needs.build.outputs.tag }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$DEPLOY_TRANSACTION_ID" =~ ^v[0-9A-Za-z._-]+-[0-9]+-[0-9]+$ ]]
          [[ "$DEPLOY_TRANSACTION_ID" != *'..'* ]]
          REMOTE_DIR="/var/tmp/otto-enterprise-github/$DEPLOY_TRANSACTION_ID"
          echo "REMOTE_DIR=$REMOTE_DIR" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail
             [ ! -L '$REMOTE_DIR' ]
             install -d -m 0700 '$REMOTE_DIR'"
          scp -i ~/.ssh/id_deploy -P "${DEPLOY_PORT}" enterprise-upload/otto-enterprise-oneclick-v${{ needs.build.outputs.version }}-* \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$REMOTE_DIR/"

      - name: Install or upgrade on server
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_CONFIG_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail
             cd '$REMOTE_DIR'
             sha256sum -c ./*.sha256 >/dev/null
             mapfile -t ARCHIVES < <(find . -maxdepth 1 -type f -name 'otto-enterprise-oneclick-v${{ needs.build.outputs.version }}-*.tar.gz' -printf '%f\\n')
             [ \"\${#ARCHIVES[@]}\" -eq 1 ]
             ARCHIVE=\${ARCHIVES[0]}
             [[ \"\$ARCHIVE\" =~ ^otto-enterprise-oneclick-v[0-9A-Za-z._-]+-[0-9a-f]{12}\\.tar\\.gz$ ]]
             rm -rf unpack
             mkdir unpack
             tar -xzf \"\$ARCHIVE\" -C unpack
             mapfile -t PKG_DIRS < <(find unpack -mindepth 1 -maxdepth 1 -type d -print)
             [ \"\${#PKG_DIRS[@]}\" -eq 1 ]
             if [ -L /opt/otto-enterprise/current ]; then
               printf '%s\\n' upgrade
             else
               printf '%s\\n' install
             fi" > deployment-action.txt
          DEPLOY_ACTION="$(cat deployment-action.txt)"
          case "$DEPLOY_ACTION" in
            install|upgrade) ;;
            *) echo "unexpected deployment action: $DEPLOY_ACTION" >&2; exit 4 ;;
          esac
          if [ "$DEPLOY_ACTION" = "upgrade" ]; then
            printf '%s\n' "$DEPLOY_SUDO_PASSWORD" | \
            ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "set -euo pipefail
               cd '$REMOTE_DIR'
               mapfile -t PKG_DIRS < <(find unpack -mindepth 1 -maxdepth 1 -type d -print)
               [ \"\${#PKG_DIRS[@]}\" -eq 1 ]
               PKG_DIR=\${PKG_DIRS[0]}
               sudo -k -S -p '' \"\$PKG_DIR/backup-now.sh\" '${DEPLOY_CONFIG_PATH}'"
          fi
          case "$DEPLOY_ACTION" in
            upgrade) DEPLOY_ENTRYPOINT=upgrade.sh ;;
            install) DEPLOY_ENTRYPOINT=install.sh ;;
          esac
          printf '%s\n' "$DEPLOY_SUDO_PASSWORD" | \
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail
             cd '$REMOTE_DIR'
             mapfile -t PKG_DIRS < <(find unpack -mindepth 1 -maxdepth 1 -type d -print)
             [ \"\${#PKG_DIRS[@]}\" -eq 1 ]
             PKG_DIR=\${PKG_DIRS[0]}
             sudo -k -S -p '' \"\$PKG_DIR/${DEPLOY_ENTRYPOINT}\" --config '${DEPLOY_CONFIG_PATH}'"

  deploy-update-mirror:
    name: Deploy Desktop Update Mirror
    needs:
      - build
      - verify-windows-signature
      - deploy-enterprise
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      ${{
        success()
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && !inputs.draft)
        )
      }}
    env:
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SUDO_PASSWORD: ${{ secrets.DEPLOY_SUDO_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}"
          test -n "${{ secrets.DEPLOY_USER }}"
          test -n "${{ secrets.DEPLOY_SSH_KEY }}"
          test -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}"
          test -n "$DEPLOY_SUDO_PASSWORD"

      - name: Download release workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: otto-release-v${{ needs.build.outputs.version }}
          path: release-download

      - name: Prepare and verify mirror payload
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          mkdir -p mirror-upload
          copy_one() {
            local pattern="$1"
            local source
            source="$(find release-download -type f -name "$pattern" -print -quit)"
            test -n "$source"
            cp "$source" mirror-upload/
          }
          copy_one "Otto-${VERSION}-arm64.dmg"
          copy_one "Otto-${VERSION}-arm64.dmg.blockmap"
          copy_one "Otto-${VERSION}-x64.dmg"
          copy_one "Otto-${VERSION}-x64.dmg.blockmap"
          copy_one "Otto-Setup-${VERSION}-win-x64.exe"
          copy_one "Otto-Setup-${VERSION}-win-x64.exe.blockmap"
          copy_one "latest.json"
          node packages/desktop/scripts/verify-update-manifest.mjs "mirror-upload" "$VERSION"
          (
            cd mirror-upload
            sha256sum Otto-* latest.json > SHA256SUMS
          )
          cp .github/scripts/publish-update-mirror.sh mirror-upload/
          PAYLOAD_MANIFEST_SHA256="$(sha256sum mirror-upload/SHA256SUMS | awk '{print $1}')"
          PUBLISH_SCRIPT_SHA256="$(sha256sum mirror-upload/publish-update-mirror.sh | awk '{print $1}')"
          [[ "$PAYLOAD_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PUBLISH_SCRIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "PAYLOAD_MANIFEST_SHA256=$PAYLOAD_MANIFEST_SHA256" >> "$GITHUB_ENV"
          echo "PUBLISH_SCRIPT_SHA256=$PUBLISH_SCRIPT_SHA256" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and atomically publish mirror
        shell: bash
        run: |
          set -euo pipefail
          MIRROR_TRANSACTION_ID="${{ needs.build.outputs.tag }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$MIRROR_TRANSACTION_ID" =~ ^v[0-9A-Za-z._-]+-[0-9]+-[0-9]+$ ]]
          [[ "$MIRROR_TRANSACTION_ID" != *'..'* ]]
          [[ "$PAYLOAD_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PUBLISH_SCRIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          REMOTE_DIR="/var/tmp/otto-update-mirror/$MIRROR_TRANSACTION_ID"
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail
             [ ! -L '$REMOTE_DIR' ]
             install -d -m 0700 '$REMOTE_DIR'"
          scp -i ~/.ssh/id_deploy -P "${DEPLOY_PORT}" mirror-upload/* \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$REMOTE_DIR/"
          printf '%s\n' "$DEPLOY_SUDO_PASSWORD" | \
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail
             cd '$REMOTE_DIR'
             [ ! -L publish-update-mirror.sh ]
             test \"\$(sha256sum publish-update-mirror.sh | awk '{print \$1}')\" = '$PUBLISH_SCRIPT_SHA256'
             test \"\$(sha256sum SHA256SUMS | awk '{print \$1}')\" = '$PAYLOAD_MANIFEST_SHA256'
             sudo -k -S -p '' /bin/bash '$REMOTE_DIR/publish-update-mirror.sh' \
               '$MIRROR_TRANSACTION_ID' '$PAYLOAD_MANIFEST_SHA256' '$PUBLISH_SCRIPT_SHA256'"

      - name: Verify public mirror
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            "${UPDATE_MIRROR_MANIFEST_URL}?run=${GITHUB_RUN_ID}" \
            --output remote-latest.json
          cmp mirror-upload/latest.json remote-latest.json
          curl --fail --silent --show-error --location --retry 3 \
            "${UPDATE_MIRROR_ASSET_BASE_URL}/Otto-Setup-${{ needs.build.outputs.version }}-win-x64.exe" \
            --output remote-windows-installer.exe
          echo "$(sha256sum mirror-upload/Otto-Setup-${{ needs.build.outputs.version }}-win-x64.exe | awk '{print $1}')  remote-windows-installer.exe" \
            | sha256sum -c -

  publish-release:
    name: Publish Verified Release
    needs:
      - build
      - verify-windows-signature
      - deploy-enterprise
      - deploy-update-mirror
    runs-on: ubuntu-latest
    if: >-
      ${{
        always()
        && needs.build.result == 'success'
        && needs.verify-windows-signature.result == 'success'
        && needs.deploy-enterprise.result == 'success'
        && needs.deploy-update-mirror.result == 'success'
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && !inputs.draft)
        )
      }}
    steps:
      - name: Verify locked release draft provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="${{ needs.build.outputs.source_commit }}"
          TAG="${{ needs.build.outputs.tag }}"
          TARGET_COMMITISH="$(gh api "repos/${RELEASES_REPO}/releases/tags/${TAG}" --jq '.target_commitish')"
          if [ "$TARGET_COMMITISH" != "$SOURCE_COMMIT" ]; then
            echo "canonical release draft target $TARGET_COMMITISH does not match locked RC $SOURCE_COMMIT" >&2
            exit 1
          fi

      - name: Verify legacy compatibility provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OTTO_LEGACY_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="${{ needs.build.outputs.source_commit }}"
          TAG="${{ needs.build.outputs.tag }}"
          RELEASE_JSON="$(gh api "repos/${LEGACY_RELEASES_REPO}/releases/tags/${TAG}")"
          TARGET_COMMITISH="$(printf '%s' "$RELEASE_JSON" | jq -r '.target_commitish')"
          BODY="$(printf '%s' "$RELEASE_JSON" | jq -r '.body // ""')"
          test "$TARGET_COMMITISH" = "main"
          printf '%s' "$BODY" | grep -F "$SOURCE_COMMIT" >/dev/null

      - name: Publish legacy compatibility release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OTTO_LEGACY_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=(--draft=false)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            EXTRA_ARGS+=(--prerelease)
          else
            EXTRA_ARGS+=(--prerelease=false --latest)
          fi
          gh release edit "${{ needs.build.outputs.tag }}" \
            --repo "${LEGACY_RELEASES_REPO}" \
            "${EXTRA_ARGS[@]}"

      - name: Publish canonical release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=(--draft=false)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            EXTRA_ARGS+=(--prerelease)
          else
            EXTRA_ARGS+=(--prerelease=false --latest)
          fi
          gh release edit "${{ needs.build.outputs.tag }}" \
            --repo "${RELEASES_REPO}" \
            "${EXTRA_ARGS[@]}"

      - name: Verify canonical release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="${{ needs.build.outputs.source_commit }}"
          TAG="${{ needs.build.outputs.tag }}"
          RESOLVED_COMMIT="$(gh api "repos/${RELEASES_REPO}/commits/${TAG}" --jq '.sha')"
          if [ "$RESOLVED_COMMIT" != "$SOURCE_COMMIT" ]; then
            echo "canonical release tag does not resolve to the locked RC commit: tag=$RESOLVED_COMMIT rc=$SOURCE_COMMIT" >&2
            exit 1
          fi

  rollback-update-mirror:
    name: Roll back Desktop Update Mirror
    needs:
      - build
      - deploy-update-mirror
      - publish-release
    runs-on: ubuntu-latest
    if: >-
      ${{
        always()
        && (
          needs.deploy-update-mirror.result == 'failure'
          || needs.deploy-update-mirror.result == 'cancelled'
          || (
            needs.deploy-update-mirror.result == 'success'
            && needs.publish-release.result != 'success'
          )
        )
        && (
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && !inputs.draft)
        )
      }}
    env:
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SUDO_PASSWORD: ${{ secrets.DEPLOY_SUDO_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}"
          test -n "${{ secrets.DEPLOY_USER }}"
          test -n "${{ secrets.DEPLOY_SSH_KEY }}"
          test -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}"
          test -n "$DEPLOY_SUDO_PASSWORD"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Restore previous mirror manifest
        shell: bash
        run: |
          set -euo pipefail
          MIRROR_TRANSACTION_ID="${{ needs.build.outputs.tag }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$MIRROR_TRANSACTION_ID" =~ ^v[0-9A-Za-z._-]+-[0-9]+-[0-9]+$ ]]
          [[ "$MIRROR_TRANSACTION_ID" != *'..'* ]]
          ROLLBACK_SCRIPT_SHA256="$(sha256sum .github/scripts/rollback-update-mirror.sh | awk '{print $1}')"
          [[ "$ROLLBACK_SCRIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          REMOTE_SCRIPT="/var/tmp/otto-update-mirror-rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          scp -i ~/.ssh/id_deploy -P "${DEPLOY_PORT}" \
            .github/scripts/rollback-update-mirror.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$REMOTE_SCRIPT"
          printf '%s\n' "$DEPLOY_SUDO_PASSWORD" | \
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail
             [ -f '$REMOTE_SCRIPT' ]
             [ ! -L '$REMOTE_SCRIPT' ]
             test \"\$(sha256sum '$REMOTE_SCRIPT' | awk '{print \$1}')\" = '$ROLLBACK_SCRIPT_SHA256'
             sudo -k -S -p '' /bin/bash '$REMOTE_SCRIPT' \
               '$MIRROR_TRANSACTION_ID' '$ROLLBACK_SCRIPT_SHA256'"

      - name: Return failed releases to draft state
        if: always()
        shell: bash
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          LEGACY_TOKEN: ${{ secrets.OTTO_LEGACY_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.build.outputs.tag }}"
          GH_TOKEN="$CANONICAL_TOKEN" gh release edit "$TAG" \
            --repo "$RELEASES_REPO" --draft=true || true
          GH_TOKEN="$LEGACY_TOKEN" gh release edit "$TAG" \
            --repo "$LEGACY_RELEASES_REPO" --draft=true || true
