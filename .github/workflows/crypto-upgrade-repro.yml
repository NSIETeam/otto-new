name: Reproduce locked Windows crypto upgrade

# Read-only regression against the exact candidate that failed run 35545865735.
# Never publishes, deploys, consumes production secrets or replaces release gates.
on:
  pull_request:
    branches: [internal]
    paths:
      - '.github/workflows/crypto-upgrade-repro.yml'
      - 'scripts/probe-windows-crypto-upgrade.cjs'
      - 'scripts/run-windows-crypto-upgrade.ps1'

permissions:
  contents: read
  actions: read

jobs:
  reproduce:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
      - name: Install pinned probe host
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch only the locked prior candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api repos/NSIETeam/otto-new/actions/runs/35545865735 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne 'a412c4e39c2199734a7fe219f1834213faf1dbe1' -or
              $run.path -cne '.github/workflows/release.yml' -or $run.run_attempt -ne 1 -or
              $run.status -cne 'completed') { throw 'Locked candidate identity differs' }
          gh run download 35545865735 --repo NSIETeam/otto-new --name otto-release-v1.9.17 --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Locked candidate unavailable; never substitute latest' }
          $files = @(Get-ChildItem -LiteralPath candidate -Recurse -File -Filter Otto-Setup-1.9.17-win-x64.exe)
          if ($files.Count -ne 1) { throw 'Ambiguous candidate' }
          if ((Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne
              '3f28953d9e0c91fb71f912bb0cb6c5bf28c5efd0bd4a5ad82c0c86eadd9938cd') { throw 'Candidate hash differs' }
      - name: Install fixed historical version and seed real encrypted state
        shell: pwsh
        run: |
          ./scripts/seed-windows-legacy-install.ps1
          ./scripts/run-windows-crypto-upgrade.ps1 -Phase seed
      - name: Upgrade with exact candidate and verify original encrypted state
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath candidate -Recurse -File -Filter Otto-Setup-1.9.17-win-x64.exe)
          if ($files.Count -ne 1) { throw 'Ambiguous candidate' }
          if ((Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne
              '3f28953d9e0c91fb71f912bb0cb6c5bf28c5efd0bd4a5ad82c0c86eadd9938cd') { throw 'Candidate changed' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'otto-packaged-runtime'
          $child = Start-Process -FilePath $files[0].FullName -ArgumentList @('/S', "/D=$installRoot") -WindowStyle Hidden -PassThru
          try {
            if (-not $child.WaitForExit(120000)) { throw 'Unknown installer outcome; no replay' }
            if ($child.ExitCode -ne 0) { throw 'Candidate install failed' }
          } finally { $child.Dispose() }
          ./scripts/run-windows-crypto-upgrade.ps1 -Phase verify -Version 1.9.17
      - name: Retain only non-secret acceptance receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locked-candidate-crypto-upgrade
          path: |
            ${{ runner.temp }}/otto-crypto-upgrade-fixture/seed.json
            ${{ runner.temp }}/otto-crypto-upgrade-fixture/verified.json
          if-no-files-found: warn
          retention-days: 14
