name: Disposable canary handshake diagnostic only

on:
  push:
    branches: [diagnostics/canary-handshake-20260909]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        mode: [original, observed, inject-go]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Fixed observation and explicitly injected fixture only
        shell: bash
        env:
          TEST_MODE: ${{ matrix.mode }}
          TEST_COMMIT: ${{ github.sha }}
          TEST_RUN_ID: ${{ github.run_id }}
          TEST_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$(git rev-parse HEAD)" = "$TEST_COMMIT"
          case "$TEST_MODE" in original|observed|inject-go) ;; *) exit 2 ;; esac
          node_path="$(command -v node)"
          test "$("$node_path" --version)" = v22.23.1
          evidence="$RUNNER_TEMP/otto-canary-evidence-$TEST_RUN_ID-$TEST_RUN_ATTEMPT-$TEST_MODE"
          mkdir -m 700 -- "$evidence"
          printf '%s\n' '{"passed":false,"phase":"preflight-not-completed"}' > "$evidence/receipt.json"
          sudo -n unshare --net -- /usr/bin/env -i \
            PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C HOME=/root \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted RUNNER_OS=Linux \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_RUN_ID="$TEST_RUN_ID" GITHUB_RUN_ATTEMPT="$TEST_RUN_ATTEMPT" \
            GITHUB_SHA="$TEST_COMMIT" OTTO_DISPOSABLE_SYSTEMD_ACCEPTANCE=1 \
            OTTO_CANARY_TEST_NODE="$node_path" \
            /usr/bin/python3 -I -B -S \
            "$GITHUB_WORKSPACE/scripts/tests/canary-handshake-diagnostic.py" \
            --mode "$TEST_MODE" \
            --work-dir "$RUNNER_TEMP/otto-canary-$TEST_RUN_ID-$TEST_RUN_ATTEMPT-$TEST_MODE" \
            --evidence-dir "$evidence"
      - name: Preserve only bounded non-secret fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canary-handshake-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/otto-canary-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}/receipt.json
            ${{ runner.temp }}/otto-canary-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}/diagnostic.json
          if-no-files-found: error
          retention-days: 14
