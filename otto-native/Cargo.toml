[package]
name = "otto-native"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "otto-native"
path = "src/main.rs"

[dependencies]
sled = "0.34"
aes-gcm = "0.10"
tiktoken-rs = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
lru = "=0.16.3"
parking_lot = "0.12"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
openmls = "=0.8.1"
openmls_basic_credential = "=0.5.0"
openmls_rust_crypto = "=0.5.1"
openmls_traits = "=0.5.0"
zeroize = "=1.9.0"

[dev-dependencies]
hpke-rs-crypto = "=0.6.1"
hpke-rs-libcrux = "=0.6.1"
libcrux-chacha20poly1305 = "=0.0.8"

[patch.crates-io]
# Manifest-only compatibility patch; see the adjacent vendor NOTICE.md.
hpke-rs-libcrux = { path = "vendor/hpke-rs-libcrux-0.6.1" }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
