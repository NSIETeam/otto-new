name: RPA browser E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

jobs:
  isolated-browser-rpa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install isolated Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Verify RPA against a local isolated page
        run: npm run test:e2e --workspace=packages/rpa
